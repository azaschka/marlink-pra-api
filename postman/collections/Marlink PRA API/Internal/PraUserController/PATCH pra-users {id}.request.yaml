name: PATCH /pra-users/:id - Modify pra user
description: |-
  Modify pra user.

  | | |
  |---|---|
  | Source | `PraUserController.modifyPraUser()` in `src/auth/controllers/pra-user.controller.ts` (module `AuthModule`) |
  | Authentication | X-API-Key header (`{{apiKey}}`, static internal key) and Bearer token (`Authorization: Bearer {{jwtToken}}`, from POST /auth/login) |
  | Swagger | excluded (`@ApiExcludeController` or `@ApiExcludeEndpoint`) |
  | Customer export | not included. Internal: protected by the static X-API-Key (ApiKeyAuthGuard). |

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `id` | integer | yes | Id of the pra user. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-API-Key` | string | yes | Static API key of the PRA platform (internal). Sent in addition to the bearer token. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `ModifyPraUserDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `username` | string | no | yes |  |
  | `password` | string | no | yes |  |
  | `email` | string | no | yes | Format: email. |
  | `role` | enum | no | yes | One of `Super Admin`, `Admin`, `Data Center Engineer`. |
  | `displayName` | string | no | yes |  |
  | `businessUnit` | enum | no | yes | One of `MT`, `OA`, `MC`, `EG`, `TE`. |
  | `canManagePraUsers` | boolean | no | yes |  |
  | `regeneratePassword` | boolean | no | yes |  |

  - The request body is the minimal valid body: required fields only.
