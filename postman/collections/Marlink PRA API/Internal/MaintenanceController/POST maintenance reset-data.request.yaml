$kind: http-request
id: 475dddb9-4203-5cad-81e3-539228d9dcf9
name: POST /maintenance/reset-data - Reset data
description: |-
  Reset data.

  | | |
  |---|---|
  | Source | `MaintenanceController.resetData()` in `src/maintenance/controllers/maintenance.controller.ts` (module `MaintenanceModule`) |
  | Authentication | X-API-Key header (`{{apiKey}}`, static internal key) and Bearer token (`Authorization: Bearer {{jwtToken}}`, from POST /auth/login) |
  | Swagger | excluded (`@ApiExcludeController` or `@ApiExcludeEndpoint`) |
  | Customer export | not included. Internal: protected by the static X-API-Key (ApiKeyAuthGuard). |

  **Authorisation and scope**

  - Only usernames listed in the server setting RESET_ALLOWED_USERNAMES may call this endpoint (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-API-Key` | string | yes | Static API key of the PRA platform (internal). Sent in addition to the bearer token. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `ResetDataDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `dryRun` | boolean | no | yes |  |
  | `confirm` | string | no | yes |  |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 200

  **Notes**

  - Reads request.user (bearer token claims) to record who executed the reset; no further request input.
  - Destructive: with `dryRun: false` and the confirmation phrase the handler expects in `confirm` (`RESET-DATA`, checked in code), the reset truncates the platform data and deletes backup files. The examples keep `dryRun: true`, which only returns the preview. Use it only on non-production environments.
url: "{{baseUrl}}/maintenance/reset-data"
method: POST
headers:
  - key: X-API-Key
    value: "{{apiKey}}"
    description: Static API key of the PRA platform (internal). Sent in addition to the bearer token. Required.
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
body:
  type: json
  content: |-
    {
      "dryRun": true
    }
examples: ./.resources/POST maintenance reset-data.resources/examples
order: 1000
