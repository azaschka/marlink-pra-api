name: POST /access - Create access
description: |-
  Create access.

  | | |
  |---|---|
  | Source | `AccessController.createAccess()` in `src/access/controllers/access.controller.ts` (module `AccessModule`) |
  | Authentication | X-API-Key header (`{{apiKey}}`, static internal key) |
  | Swagger | excluded (`@ApiExcludeController` or `@ApiExcludeEndpoint`) |
  | Customer export | not included. Internal: protected by the static X-API-Key (ApiKeyAuthGuard). |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `CreateAccessDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `key` | string | yes | no | The key of the access. Rules: not empty. |
  | `name` | string | yes | no | The name of the access. Rules: not empty. |
  | `value` | object | yes | no | The access. Rules: not empty. |
  | `value.businessUnits` | array<enum> | yes | no | The business units included in the access scope. One of `MT`, `OA`, `MC`, `EG`, `TE`. Rules: not empty. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the access was created successfully and contains the new access. `AccessCreatedDtoOutput`
  - 409: An access with the specified key already exists.
