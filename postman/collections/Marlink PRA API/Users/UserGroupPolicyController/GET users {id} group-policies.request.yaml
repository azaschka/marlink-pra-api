name: GET /users/:id/group-policies - Retrieve user group policies
description: |-
  Retrieve user group policies.

  | | |
  |---|---|
  | Source | `UserGroupPolicyController.retrieveUserGroupPolicies()` in `src/user-group-policy/controllers/user-group-policy.controller.ts` (module `UserGroupPolicyModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `id` | integer | yes | Unique identifier for the resource. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Query parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `pageSize` | integer | no | The number of items to include in a paginated response. Default `100`. |
  | `pageNumber` | integer | no | The 1-based index of the desired page. Default `1`. |
  | `groupPolicyNamePatterns` | array<string> | no | Filters results to include only policies that match the given name patterns. Repeat the parameter for several values (`?name=a&name=b`). |

  Optional query parameters are present but disabled; enable them when needed.

  **Responses**

  - 200: Returns the group policies associated with the user. `UserGroupPolicyRetrievedDtoOutput[]`
