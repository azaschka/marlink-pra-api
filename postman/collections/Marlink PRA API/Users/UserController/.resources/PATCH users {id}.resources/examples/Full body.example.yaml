$kind: http-example
request:
  url: "{{baseUrl}}/users/:id"
  method: PATCH
  body:
    type: json
    content: |-
      {
        "publicDisplayName": "Example public display name",
        "username": "example.user",
        "password": "replace-with-secret",
        "passwordExpirationDate": "2026-01-01T00:00:00.000Z",
        "email": "user@example.com",
        "preferredEmailLanguage": "en-US",
        "isTwoFactorAuthRequired": false,
        "isLoginAllowed": false,
        "failedLoginAttempts": 1,
        "mustResetPasswordOnNextLogin": false,
        "regeneratePassword": false
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
