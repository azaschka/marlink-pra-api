$kind: http-request
id: d01460ec-3ea6-5b31-9919-1d1be9fc720d
name: POST /users - Create user
description: |-
  Create user.

  | | |
  |---|---|
  | Source | `UserController.createUser()` in `src/user/controllers/user.controller.ts` (module `UserModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `CreateUserDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `publicDisplayName` | string | yes | no | The user's public display name. This attribute is read-only for users who belong to a security provider that synchronizes display names. Rules: not empty. |
  | `username` | string | yes | no | The username the user last used to log in. This attribute is read-only for non-local users. Rules: not empty. |
  | `password` | string | no | yes | The local user's password. This attribute is write-only for local users. It cannot be set in non-local user PATCH requests. It is not returned in GET requests. |
  | `passwordExpirationDate` | string | no | yes | The date and time at which the local user's password will expire as an RFC3339 date-time string. This attribute is only returned for local users and can only be updated on local users. If not set or set to a null or empty value, then the local user's password never expires. Format: date-time. Only @IsOptional: the value is not otherwise validated. |
  | `email` | string | no | yes | The user's email address. This attribute is read-only for users who belong to a security provider that synchronizes email addresses. |
  | `preferredEmailLanguage` | string | no | yes | Must be the locale code for one of the locales listed. |
  | `isTwoFactorAuthRequired` | boolean | no | yes | If true, this user must use two factor authentication via a TOTP application. If false, this user may opt-in to using two-factor authentication via a TOTP application. There is no way to prevent a user from opting in to two-factor authentication. This attribute is only available for local and LDAP users. |
  | `isLoginAllowed` | boolean | no | yes | True if this user is allowed to log in. |
  | `failedLoginAttempts` | integer | no | yes | The number of times this local user has failed to authenticate. This attribute is only returned for local users and can only be updated on local users. It is always 0 for new local users, so it is ignored in POST requests. You may set it to 0 in PATCH requests to unlock an account that has too many failed logins. |
  | `mustResetPasswordOnNextLogin` | boolean | no | yes | If true, this local user's password must be reset on their next login. This attribute is only returned for local users and can only be set on local users. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the user was created successfully and contains the new user instance. `UserCreatedDtoOutput`
  - 422: One or more request parameters are invalid. The body contains a general error message as well as a validation error dictionary.

  **Notes**

  - Records the request path in the monitoring table.
url: "{{baseUrl}}/users"
method: POST
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    description: BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. Required.
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
body:
  type: json
  content: |-
    {
      "publicDisplayName": "Example public display name",
      "username": "example.user"
    }
examples: ./.resources/POST users.resources/examples
order: 3000
