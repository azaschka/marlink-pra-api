$kind: http-example
request:
  url: "{{baseUrl}}/jumpoints"
  method: POST
  body:
    type: json
    content: |-
      {
        "name": "Example name",
        "platformType": "windows-x86",
        "codeName": "Example code name",
        "comments": "example-comments",
        "isEnabled": false,
        "isClustered": false,
        "isShellJumpEnabled": false,
        "externalJumpItemNetworkId": "example-external-jump-item-network-id",
        "isProtocolTunnelEnabled": false,
        "rdpServiceAccountId": 1,
        "managedIpRanges": [
          {
            "start": "192.0.2.1",
            "end": "192.0.2.254"
          }
        ],
        "isJzpEnabled": false,
        "jzpProxyHostname": "host.example.com",
        "jzpProxyPort": 1,
        "isJzpHttpGetAllowed": false,
        "jzpClientAddressRestrictionsType": "no-restriction",
        "jzpRestrictedIps": [
          "example-jzp-restricted-ips"
        ]
      }
response:
  statusCode: 201
  statusText: Created
  body:
    type: text
    content: ""
order: 1000
