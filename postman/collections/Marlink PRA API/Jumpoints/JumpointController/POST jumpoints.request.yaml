$kind: http-request
id: 37ded82c-b62a-5856-a74c-83c0257ba556
name: POST /jumpoints - Create jumpoint
description: |-
  Create jumpoint.

  | | |
  |---|---|
  | Source | `JumpointController.createJumpoint()` in `src/jumpoint/controllers/jumpoint.controller.ts` (module `JumpointModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `CreateJumpointDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `name` | string | yes | no | The display name of the Jumpoint. This value must be unique. Rules: not empty. |
  | `platformType` | enum | yes | no | The platform of the Jumpoint. This attribute cannot be modified after the Jumpoint is created. One of `windows-x86`, `linux-x86`. Rules: not empty. |
  | `codeName` | string | no | yes | The code name of the Jumpoint. This value must be unique. Only letters, numbers, underscores, and hyphens are allowed. |
  | `comments` | string | no | yes | The Jumpoint's comments. |
  | `isEnabled` | boolean | no | yes | If true, the Jumpoint is enabled. |
  | `isClustered` | boolean | no | yes | If true, the Jumpoint can have more than one node. This attribute cannot be modified after the Jumpoint is created. |
  | `isShellJumpEnabled` | boolean | no | yes | If true, users are allowed to start Shell Jump sessions with the Jumpoint. |
  | `externalJumpItemNetworkId` | string | no | yes | This field is only applicable when the search for external jump items is allowed. The value must be unique if it is not empty. |
  | `isProtocolTunnelEnabled` | boolean | no | yes | If true, users are allowed to start Protocol Tunnel sessions with the Jumpoint. |
  | `rdpServiceAccountId` | integer | no | yes | The unique identifier of the Vault account through which RDP sessions can also receive additional audit capabilities. It must be a generic account or a domain account. |
  | `managedIpRanges` | array<object> | no | yes | An array of dotted-decimal IPv4 address ranges that should be managed by the network tunnel service on this Jumpoint. If the Network Tunnel feature will be used on one or more networks which do not provide a DHCP service, provide ranges from which allocations can be made for access sessions. An IP address for each network that the filter rules of a Protocol Tunnel Jump Shortcut allows will be allocated to a user while participating in a session. Take care to provide ranges that do not contain IP addresses which could be used by other systems on that network. |
  | `managedIpRanges[].start` | string | yes | no | The starting IPv4 address of the range. Rules: not empty. |
  | `managedIpRanges[].end` | string | yes | no | The ending IPv4 address of the range. Rules: not empty. |
  | `isJzpEnabled` | boolean | no | yes | Indicates whether the Jump Zone Proxy feature is enabled. This value can be null in responses for Jumpoints created before an upgrade until the Jumpoint connects for the first time after the upgrade. |
  | `jzpProxyHostname` | string | no | yes | The hostname of the Jump Zone Proxy server. This parameter is only used for standalone Jumpoints and is only valid if the Jump Zone Proxy is enabled. This value can be null in responses for Jumpoints created before an upgrade until the Jumpoint connects for the first time after the upgrade. |
  | `jzpProxyPort` | integer | no | yes | TCP Port of the Jump Zone Proxy. Only valid when the Jump Zone Proxy is enabled. This value can be null in responses for Jumpoints created before an upgrade until the Jumpoint connects for the first time after the upgrade. |
  | `isJzpHttpGetAllowed` | boolean | no | yes | If enabled, HTTP GET requests are permitted through the proxy to the BeyondTrust appliance, and this setting is only applicable if the Jump Zone Proxy is enabled. This value can be null in responses for Jumpoints created before an upgrade until the Jumpoint connects for the first time after the upgrade. |
  | `jzpClientAddressRestrictionsType` | enum | no | yes | The type of client address restrictions to apply to the JZP. If set to no-restriction, the jzpRestrictedIps field is ignored. If set to allow-all, the jzpRestrictedIps field is used to specify a list of allowed network address prefixes. If set to deny-all, the jzpRestrictedIps field is used to specify a list of denied network address prefixes. One of `no-restriction`, `allow-all`, `deny-all`. Default `no-restriction`. |
  | `jzpRestrictedIps` | array<string> | no | yes | Array of network address prefixes, where netmasks are optional and can be specified in either dotted-decimal or integer bitmask format. If a netmask is omitted, the entry is assumed to be a single IP address. This field is only valid if the jzpClientAddressRestrictionsType is set to allow-all or deny-all. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the Jumpoint was created successfully and contains the new instance. `JumpointCreatedDtoOutput`
  - 422: One or more request parameters are invalid. The body contains a general error message as well as a validation error dictionary.

  **Notes**

  - Records the request path in the monitoring table.
url: "{{baseUrl}}/jumpoints"
method: POST
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    description: BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. Required.
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
