$kind: http-request
id: b8cc8d62-6802-5135-8e0b-a308a5991cb9
name: GET /jumpoints/installers - Retrieve jumpoint installer by customer and site
description: |-
  Retrieve jumpoint installer by customer and site.

  | | |
  |---|---|
  | Source | `JumpointExtensionController.retrieveJumpointInstallerByCustomerAndSite()` in `src/jumpoint/controllers/jumpoint-extension.controller.ts` (module `JumpointModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | no | Optional BeyondTrust instance id. When sent, the customer scope of the access key is narrowed to customers of that instance. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Query parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `businessUnits` | array<enum> | no | The business units to be filtered. Repeat the parameter for several values (`?name=a&name=b`). One of `MT`, `OA`, `MC`, `EG`, `TE`. |
  | `customerKey` | string | no | Unique key for the customer. |
  | `siteKey` | string | yes | Unique key for the site. Rules: not empty. |

  Optional query parameters are present but disabled; enable them when needed.

  **Responses**

  - 200
  - 404: The specified resource was not found.

  **Notes**

  - Records the request path in the monitoring table.
  - Response: Jumpoint installer of the site streamed from BeyondTrust. Use "Send and Download".
url: "{{baseUrl}}/jumpoints/installers?siteKey=EXAMPLE_SITE"
method: GET
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    disabled: true
    description: Optional BeyondTrust instance id. When sent, the customer scope of the access key is narrowed to customers of that instance.
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
queryParams:
  - key: businessUnits
    value: MT
    disabled: true
    description: "The business units to be filtered. Repeat the parameter for several values (`?name=a&name=b`). One of: MT, OA, MC, EG, TE. Optional."
  - key: customerKey
    value: EXAMPLE_CUSTOMER
    disabled: true
    description: Unique key for the customer. Optional.
  - key: siteKey
    value: EXAMPLE_SITE
    description: Unique key for the site. Required.
order: 1000
