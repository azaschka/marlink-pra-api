$kind: http-request
id: 4a3cbbe2-3467-5b93-845a-20ddad971d2c
name: POST /group-policies - Create group policy
description: |-
  Create group policy.

  | | |
  |---|---|
  | Source | `GroupPolicyController.createGroupPolicy()` in `src/group-policy/controllers/group-policy.controller.ts` (module `GroupPolicyModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `CreateGroupPolicyDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `name` | string | yes | no | The name of the group policy. Rules: not empty. |
  | `hasEndpointsAccessPermission` | boolean | no | yes | Allowed to access endpoints. |
  | `accessPermissionStatusType` | enum | no | yes | This field indicates if this policy defines user permissions or not. A value of 'defined' means the policy defines values for user permissions. A value of 'final' is the same as defined, except it will also prevent other policies of lower priority from overriding the permission value set by this Policy. The default value is "defined" if the request includes any user permission fields; otherwise the default is "not-defined". One of `not-defined`, `defined`, `final`. |
  | `hasShareOtherTeamPermission` | boolean | no | yes | Allowed to share sessions with teams which they do not belong to. |
  | `hasInviteExternalUserPermission` | boolean | no | yes | Allowed to invite external Users. |
  | `userSessionIdleTimeoutInSeconds` | number | no | yes | Remove User from the session after they've been inactive for a certain number of seconds. Allowed values are -1, 0, 300, 600, 900, 1800, 3600, 7200, 14400, 28800, 43200, and 86400. -1 means "Use site wide setting". 0 means "No timeout". |
  | `hasEnableExtendedAvailabilityModePermission` | boolean | no | yes | Allowed to enable extended availability mode. |
  | `hasEditExternalKeyPermission` | boolean | no | yes | Allowed to edit the external key. |
  | `hasCollaboratePermission` | boolean | no | yes | Allowed to show screen to other Users. |
  | `hasCollaborateControlPermission` | boolean | no | yes | Allowed to give control when showing screen to other Users. |
  | `hasJumpClientPermission` | boolean | no | yes | Allowed to use Jump Clients. |
  | `hasLocalJumpPermission` | boolean | no | yes | Allowed to use Local Jump (Windows only). |
  | `hasRemoteJumpPermission` | boolean | no | yes | Allowed to use Remote Jump. |
  | `hasRemoteVncPermission` | boolean | no | yes | Allowed to use Remote VNC. |
  | `hasRemoteRdpPermission` | boolean | no | yes | Allowed to use Remote RDP. |
  | `hasShellJumpPermission` | boolean | no | yes | Allowed to use Shell Jump. |
  | `hasWebJumpPermission` | boolean | no | yes | Allowed to use Web Jump. |
  | `hasProtocolTunnelPermission` | boolean | no | yes | Allowed to use Protocol Tunnel Jump. |
  | `hasSdStaticPortForExternalToolsPermission` | boolean | no | yes | Allowed to use static port and username for external tool sessions. |
  | `defaultJumpItemRoleId` | number | no | yes | Default Jump Item Role. |
  | `privateJumpItemRoleId` | number | no | yes | Personal Jump Item Role. |
  | `inferiorJumpItemRoleId` | number | no | yes | Teams Jump Item Role. |
  | `unassignedJumpItemRoleId` | number | no | yes | System Jump Item Role. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the group policy was created successfully and contains the new group policy instance. `GroupPolicyCreatedDtoOutput`
  - 422: One or more request parameters are invalid. The body contains a general error message as well as a validation error dictionary.

  **Notes**

  - Records the request path in the monitoring table.
