$kind: http-request
id: 9d84d2b2-993c-5e27-a460-5d5ba00f3868
name: POST /license-usages/customers/:id - Calculate customer license usage
description: |-
  Calculate customer license usage.

  | | |
  |---|---|
  | Source | `CustomerLicenseUsageController.calculateCustomerLicenseUsage()` in `src/license-usage/controllers/customer-license-usage.controller.ts` (module `LicenseUsageModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `id` | integer | yes | Unique identifier for the resource. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | no | Optional BeyondTrust instance id. When sent, the customer scope of the access key is narrowed to customers of that instance. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Responses**

  - 200: Indicates the customer license usage was successfully calculated. `CustomerLicenseUsageDtoOutput`
  - 404: The specified resource was not found.

  **Notes**

  - Records the request path in the monitoring table.
url: "{{baseUrl}}/license-usages/customers/:id"
method: POST
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    disabled: true
    description: Optional BeyondTrust instance id. When sent, the customer scope of the access key is narrowed to customers of that instance.
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
pathVariables:
  - key: id
    value: "{{customerId}}"
    description: Unique identifier for the resource. Required.
order: 1000
