description: |-
  Retrieve session policies.

  | | |
  |---|---|
  | Source | `SessionPolicyController.retrieveSessionPolicies()` in `src/session-policy/controllers/session-policy.controller.ts` (module `SessionPolicyModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | not included. Not yet approved for the customer export (new or unclassified operation); kept in the internal collection only. |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Query parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `pageSize` | integer | no | The number of items to include in a paginated response. Default `100`. |
  | `pageNumber` | integer | no | The 1-based index of the desired page. Default `1`. |
  | `displayName` | string | no | Display name. |
  | `codeName` | string | no | Code name. |
  | `codeNamePatterns` | array<string> | no | Filters results to include only session policies that match the given code name patterns. Repeat the parameter for several values (`?name=a&name=b`). |

  Optional query parameters are present but disabled; enable them when needed.

  **Responses**

  - 200: `SessionPolicyRetrievedDtoOutput[]`

  **Notes**

  - Records the request path in the monitoring table.
