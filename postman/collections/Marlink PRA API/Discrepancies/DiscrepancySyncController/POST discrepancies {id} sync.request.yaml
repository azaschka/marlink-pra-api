name: POST /discrepancies/:id/sync - Sync discrepancy
description: |-
  Sync discrepancy.

  | | |
  |---|---|
  | Source | `DiscrepancySyncController.syncDiscrepancy()` in `src/discrepancy/controllers/discrepancy-sync.controller.ts` (module `DiscrepancyModule`) |
  | Authentication | None. The route has no authentication guard. |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `id` | integer | yes | The id of the discrepancy. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `SyncDiscrepancyDtoInput`, NOT validated on this route)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `syncType` | enum | yes | no | The type of synchronization to perform. One of `internal-to-external`, `external-to-internal`. Rules: not empty. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 200

  **Notes**

  - Records the request path in the monitoring table.

  **Contract notes** (effective behaviour in code versus Swagger metadata)

  - No authentication guard: the route is reachable without credentials (code-verified).
  - No ValidationPipe on this route: the rules of SyncDiscrepancyDtoInput are documented but not enforced.
