$kind: http-request
id: 65bb5540-635b-5cb0-bfc9-c8d9c4c4d4c2
name: POST /discrepancies/scan/:entityType - Scan discrepancies
description: |-
  Scan discrepancies.

  | | |
  |---|---|
  | Source | `DiscrepancyScannerController.scanDiscrepancies()` in `src/discrepancy/controllers/discrepancy-scanner.controller.ts` (module `DiscrepancyModule`) |
  | Authentication | None. The route has no authentication guard. |
  | Swagger | documented in /open-api |
  | Customer export | not included. Folder Discrepancies: platform operations triggered only by the PRA Console. |

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `entityType` | enum | yes | The type of entity to scan for discrepancies. One of `group-policy`, `group-policy-jump-group`, `group-policy-jumpoint`, `group-policy-member`, `group-policy-team`, `jump-client`, `jump-client-installer`, `jump-group`, `jump-item-protocol-tunnel-jump`, `jump-item-remote-rdp`, `jump-item-remote-vnc`, `jump-item-shell-jump`, `jump-item-web-jump`, `jump-policy`, `jumpoint`, `jumpoint-node`, `session-policy`, `team`, `team-user`, `user`, `user-group-policy`. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Responses**

  - 200: `DiscrepancyOverviewDtoOutput`

  **Notes**

  - Records the request path in the monitoring table.

  **Contract notes** (effective behaviour in code versus Swagger metadata)

  - No authentication guard: the route is reachable without credentials (code-verified).
url: "{{baseUrl}}/discrepancies/scan/:entityType"
method: POST
