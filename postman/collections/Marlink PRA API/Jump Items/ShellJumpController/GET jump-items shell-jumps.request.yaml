  | | |
  |---|---|
  | Source | `ShellJumpController.retrieveShellJumps()` in `src/jump-item/shell-jump/controllers/shell-jump.controller.ts` (module `ShellJumpModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
