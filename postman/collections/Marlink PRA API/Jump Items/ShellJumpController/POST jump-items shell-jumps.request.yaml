  content: |-
    {
      "name": "Example name",
      "jumpointId": 1,
      "hostname": "host.example.com",
      "protocolType": "ssh",
      "jumpGroupId": 1,
      "tag": "example-tag"
    }
examples: ./.resources/POST jump-items shell-jumps.resources/examples
