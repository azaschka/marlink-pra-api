$kind: http-request
id: ae260764-2ae4-5632-9c57-0524c429e1ed
name: POST /jump-items/remote-rdps - Create remote rdp
description: |-
  Create remote rdp.

  | | |
  |---|---|
  | Source | `RemoteRdpController.createRemoteRdp()` in `src/jump-item/remote-rdp/controllers/remote-rdp.controller.ts` (module `RemoteRdpModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Resolves the jump groups of the customers in scope; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `CreateRemoteRdpDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `name` | string | yes | no | Rules: not empty. |
  | `jumpointId` | integer | yes | no | Rules: not empty. |
  | `hostname` | string | yes | no | Rules: not empty. |
  | `jumpGroupId` | integer | yes | no | Rules: not empty. |
  | `jumpGroupType` | enum | no | yes | One of `shared`, `personal`. |
  | `qualityMode` | enum | no | yes | One of `low`, `performance`, `best-performance`, `performance-quality`, `quality`, `video`, `lossless`. |
  | `mustStartNewConsoleSession` | boolean | no | yes |  |
  | `mustIgnoreUntrustedServerCert` | boolean | no | yes | Currently ignored. RDP Jump Items always have untrusted server certificate warnings disabled (MARLINKPRA-55), regardless of the value provided here. |
  | `tag` | string | yes | no | The tag of the asset. Mandatory. The value is normalized to the canonical form: whitespace and hyphens become underscores, special characters are mapped or removed, only A-Z, 0-9 and _ remain, and the result is UPPERCASE. A tag that is empty after normalization is rejected. Rules: not empty. Normalised by a @Transform rule before validation. |
  | `comments` | string | no | yes |  |
  | `rdpUsername` | string | no | yes |  |
  | `domain` | string | no | yes |  |
  | `jumpPolicyId` | integer | no | yes |  |
  | `isSessionForensicsEnabled` | boolean | no | yes |  |
  | `sessionPolicyId` | integer | no | yes |  |
  | `secureAppType` | enum | no | yes | One of `none`, `remote-app`, `remote-desktop-agent`, `remote-desktop-agent-credentials`. |
  | `remoteAppName` | string | no | yes |  |
  | `remoteAppParams` | string | no | yes |  |
  | `remoteExePath` | string | no | yes |  |
  | `remoteExeParams` | string | no | yes |  |
  | `targetSystem` | string | no | yes |  |
  | `credentialType` | string | no | yes |  |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the Remote RDP Jump Item was created successfully and contains the new Remote RDP Jump Item instance. `RemoteRdpCreatedDtoOutput`
  - 409: A Remote RDP Jump Item already exists.
  - 422: One or more request parameters are invalid. The body contains a general error message as well as a validation error dictionary.

  **Notes**

  - Records the request path in the monitoring table.
url: "{{baseUrl}}/jump-items/remote-rdps"
method: POST
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    description: BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. Required.
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
body:
  type: json
  content: |-
    {
      "name": "Example name",
      "jumpointId": 1,
      "hostname": "host.example.com",
      "jumpGroupId": 1,
      "tag": "example-tag"
    }
examples: ./.resources/POST jump-items remote-rdps.resources/examples
order: 3000
