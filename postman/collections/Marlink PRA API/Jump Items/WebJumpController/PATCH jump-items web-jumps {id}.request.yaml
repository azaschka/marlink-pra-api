name: PATCH /jump-items/web-jumps/:id - Modify web jump
description: |-
  Modify web jump.

  | | |
  |---|---|
  | Source | `WebJumpController.modifyWebJump()` in `src/jump-item/web-jump/controllers/web-jump.controller.ts` (module `WebJumpModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Resolves the jump groups of the customers in scope; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `id` | integer | yes | Unique identifier for the resource. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `ModifyWebJumpDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `name` | string | no | yes |  |
  | `jumpointId` | integer | no | yes |  |
  | `url` | string | no | yes |  |
  | `jumpGroupId` | integer | no | yes |  |
  | `jumpGroupType` | enum | no | yes | One of `shared`, `personal`. |
  | `usernameFormatType` | enum | no | yes | One of `default`, `username-only`, `force-upn-format`, `force-dlln-format`. |
  | `mustVerifyCertificate` | boolean | no | yes |  |
  | `authenticationTimeoutInSeconds` | integer | no | yes |  |
  | `tag` | string | conditional | no | The tag of the asset. Optional. If omitted, the existing tag is left unchanged. If provided, it must not be empty. The value is normalized to the canonical form: whitespace and hyphens become underscores, special characters are mapped or removed, only A-Z, 0-9 and _ remain, and the result is UPPERCASE. A tag that is empty after normalization is rejected. Rules: validated only when a condition on other fields holds (@ValidateIf), not empty. Normalised by a @Transform rule before validation. |
  | `comments` | string | no | yes |  |
  | `jumpPolicyId` | integer | no | yes |  |
  | `usernameField` | string | no | yes |  |
  | `passwordField` | string | no | yes |  |
  | `submitField` | string | no | yes |  |
  | `sessionPolicyId` | integer | no | yes |  |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.
  - Every field is optional, but an empty object is rejected (NonEmptyBodyPipe). The minimal body therefore sends one field (`name`); send only the fields you want to change.

  **Responses**

  - 200: Indicates the existing Web Jump was successfully updated and returns the Web Jump. `WebJumpModifiedDtoOutput`
  - 404: The specified resource was not found.
  - 422: One or more request parameters are invalid. The body contains a general error message as well as a validation error dictionary.

  **Notes**

  - Records the request path in the monitoring table.
