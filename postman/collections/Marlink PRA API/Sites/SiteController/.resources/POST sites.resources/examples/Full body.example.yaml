  method: POST
  body:
    type: json
    content: |-
      {
        "key": "EXAMPLE_KEY",
        "name": "Example name",
        "customerKey": "EXAMPLE_CUSTOMER",
        "siteManagers": [
          {
            "username": "example.user",
            "email": "user@example.com",
