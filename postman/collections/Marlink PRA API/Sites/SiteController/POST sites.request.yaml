$kind: http-request
id: 3ba0ecda-9e5f-5bf4-bdaa-0283ff9292dd
name: POST /sites - Create site
description: |-
  Create site.

  | | |
  |---|---|
  | Source | `SiteController.createSite()` in `src/site/controllers/site.controller.ts` (module `SiteModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | no | Optional BeyondTrust instance id. When sent, the customer scope of the access key is narrowed to customers of that instance. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `CreateSiteDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `key` | string | yes | no | The unique key of the site. Rules: not empty. Normalised by a @Transform rule before validation. |
  | `name` | string | yes | no | The name of the site. Rules: not empty. Normalised by a @Transform rule before validation. |
  | `customerKey` | string | yes | no | The key of the customer to which this site belongs. Rules: not empty. |
  | `siteManagers` | array<object> | yes | no | Rules: at least one item. |
  | `siteManagers[].username` | string | yes | no | The username of the site manager. Rules: not empty. |
  | `siteManagers[].email` | string | yes | no | The email of the site manager. Rules: not empty. |
  | `siteManagers[].sourceType` | enum | no | no | The source type of the site manager. One of `internal`, `external`. Default `internal`. Defaults to the value shown when omitted (the DTO initialiser runs during transformation). |
  | `siteAuditors` | array<object> | no | yes | The complete list of site auditors. Omit it to keep the existing auditors of an existing site unchanged; an empty list removes them. |
  | `siteAuditors[].username` | string | yes | no | The username of the site auditor. Rules: not empty. |
  | `siteAuditors[].email` | string | yes | no | The email of the site auditor. Rules: not empty. |
  | `siteAuditors[].isAdminOperator` | boolean | yes | no | Indicates if the user is an admin operator. Rules: not empty. |
  | `siteAuditors[].sourceType` | enum | no | no | The source type of the site auditor. One of `internal`, `external`. Default `internal`. Defaults to the value shown when omitted (the DTO initialiser runs during transformation). |
  | `siteSupportTeamMembers` | array<object> | no | yes | The complete list of site support team members. Omit it to keep the existing members of an existing site unchanged; an empty list removes them. |
  | `siteSupportTeamMembers[].firstname` | string | yes | no | The firstname of the site support team member. Rules: not empty. |
  | `siteSupportTeamMembers[].lastname` | string | yes | no | The lastname of the site support team member. Rules: not empty. |
  | `siteSupportTeamMembers[].email` | string | yes | no | The email of the site support team member. Rules: not empty. |
  | `siteSupportTeamMembers[].supportTeamName` | string | yes | no | The support team name of the site support team member. Rules: not empty. Normalised by a @Transform rule before validation. |
  | `siteSupportTeamMembers[].supportTeamAccessLevel` | enum | yes | no | The access level of the site support team member. One of `full`, `limited`. Rules: not empty. |
  | `siteSupportTeamMembers[].supportTeamTrustLevel` | enum | yes | no | The trust level of the site support team member. One of `require-auth`, `notify-only`, `no-restrictions`. Rules: not empty. |
  | `siteSupportTeamMembers[].sourceType` | enum | no | no | The source type of the site support team member. One of `internal`, `external`. Default `internal`. Defaults to the value shown when omitted (the DTO initialiser runs during transformation). |
  | `siteApprovers` | array<string> | no | yes | The complete list of site approver emails. Omit it to keep the existing approvers of an existing site unchanged; an empty list removes them. Rules: unique items. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the site was created successfully and contains the processing result. `SiteProcessingResultDtoOutput`
  - 404: The customer key is not found.
  - 409: The specified site already exists.

  **Notes**

  - Records the request path in the monitoring table.

  **Contract notes** (effective behaviour in code versus Swagger metadata)

  - CreateSiteDtoInput.siteManagers[].sourceType: Swagger declares required: true; effective validation makes it optional.
  - CreateSiteDtoInput.siteAuditors[].sourceType: Swagger declares required: true; effective validation makes it optional.
  - CreateSiteDtoInput.siteSupportTeamMembers[].sourceType: Swagger declares required: true; effective validation makes it optional.
