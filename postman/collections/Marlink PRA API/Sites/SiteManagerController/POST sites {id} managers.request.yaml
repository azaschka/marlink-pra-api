$kind: http-request
id: ba232311-3802-5a4a-b0fe-db1730a57668
name: POST /sites/:id/managers - Add site manager
description: |-
  Add site manager.

  | | |
  |---|---|
  | Source | `SiteManagerController.addSiteManager()` in `src/site/controllers/site-manager.controller.ts` (module `SiteModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `id` | integer | yes | Unique identifier for the site. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | no | Optional BeyondTrust instance id. When sent, the customer scope of the access key is narrowed to customers of that instance. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `SiteManagerDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `username` | string | yes | no | The username of the site manager. Rules: not empty. |
  | `email` | string | yes | no | The email of the site manager. Rules: not empty. |
  | `sourceType` | enum | no | no | The source type of the site manager. One of `internal`, `external`. Default `internal`. Defaults to the value shown when omitted (the DTO initialiser runs during transformation). |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the site manager was added successfully. `SiteManagerDtoOutput`
  - 404: The specified resource was not found.
  - 409: The specified site manager already exists.

  **Notes**

  - Records the request path in the monitoring table.

  **Contract notes** (effective behaviour in code versus Swagger metadata)

  - SiteManagerDtoInput.sourceType: Swagger declares required: true; effective validation makes it optional.
