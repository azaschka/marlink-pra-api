$kind: http-request
id: 7a0d6d07-3f0d-50e3-aab6-0ec3c2354304
name: PATCH /jump-clients/:id - Modify jump client
description: |-
  Modify jump client.

  | | |
  |---|---|
  | Source | `JumpClientController.modifyJumpClient()` in `src/jump-client/controllers/jump-client.controller.ts` (module `JumpClientModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Resolves the jump groups of the customers in scope; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `id` | integer | yes | Unique identifier for the resource. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `ModifyJumpClientDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `jumpGroupId` | integer | no | yes | The unique identifier of the shared Jump Group or user that owns this Jump Client. |
  | `jumpGroupType` | enum | no | yes | The type of Jump Group that owns this Jump Client. One of `personal`, `shared`. |
  | `name` | string | no | yes | The Jump Client's user-friendly name. |
  | `tag` | string | conditional | no | The Jump Client's tag. Optional. If omitted, the existing tag is left unchanged. If provided, it must not be empty. The value is normalized to the canonical form: whitespace and hyphens become underscores, special characters are mapped or removed, only A-Z, 0-9 and _ remain, and the result is UPPERCASE. A tag that is empty after normalization is rejected. Rules: validated only when a condition on other fields holds (@ValidateIf), not empty. Normalised by a @Transform rule before validation. |
  | `comments` | string | no | yes | The Jump Client's comments. |
  | `jumpPolicyId` | integer | no | yes | The unique identifier of the Jump Policy used to manage access to this Jump Item. |
  | `sessionPolicyId` | integer | no | yes | The session policy used on the Jump Client system. |
  | `maxOfflineDurationInMinutes` | integer | no | yes | The maximum number of minutes the Jump Client can be offline before being uninstalled. If 0, this Jump Client follows the global lost client settings. |
  | `endpointAgreementPolicyType` | enum | no | yes | The value accept will automatically accept the endpoint agreement if it times out and allow the session to start. The value reject will automatically reject the endpoint agreement and stop the session from starting. The value no-prompt will not show an endpoint agreement even if the feature is configured. This field has no effect if the global endpoint agreement setting is not enabled. This field is only available for GET and PATCH requests. One of `no-prompt`, `accept`, `reject`. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.
  - Every field is optional, but an empty object is rejected (NonEmptyBodyPipe). The minimal body therefore sends one field (`name`); send only the fields you want to change.

  **Responses**

  - 200: Indicates the existing Jump Client was successfully updated and returns the Jump Client. `JumpClientModifiedDtoOutput`
  - 404: The specified resource was not found.
  - 422: One or more request parameters are invalid. The body contains a general error message as well as a validation error dictionary.

  **Notes**

  - Records the request path in the monitoring table.
url: "{{baseUrl}}/jump-clients/:id"
method: PATCH
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    description: BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. Required.
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
pathVariables:
  - key: id
    value: "{{jumpClientId}}"
    description: Unique identifier for the resource. Required.
body:
  type: json
  content: |-
    {
      "name": "Example name"
    }
examples: ./.resources/PATCH jump-clients {id}.resources/examples
order: 3000
