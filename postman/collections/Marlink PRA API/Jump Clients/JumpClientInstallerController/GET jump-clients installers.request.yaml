name: GET /jump-clients/installers - Retrieve jump client installers
description: |-
  Retrieve jump client installers.

  | | |
  |---|---|
  | Source | `JumpClientInstallerController.retrieveJumpClientInstallers()` in `src/jump-client/controllers/jump-client-installer.controller.ts` (module `JumpClientModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Resolves the jump groups of the customers in scope; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Query parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `pageSize` | integer | no | The number of items to include in a paginated response. Default `100`. |
  | `pageNumber` | integer | no | The 1-based index of the desired page. Default `1`. |
  | `name` | string | no | Filters Jump Clients installers by the given name. |
  | `hostname` | string | no | Filters Jump Clients installers by the given hostname (computer name). |
  | `fqdn` | string | no | Filters Jump Clients installers by the given fully qualified domain name. |
  | `tag` | string | no | Filters Jump Clients installers by the given tag. |
  | `jumpGroupIds` | array<integer> | no | Filters Jump Clients installers by the given jump group ids. Repeat the parameter for several values (`?name=a&name=b`). |
  | `jumpGroupType` | enum | no | Filters Jump Clients installers by the given jump group type. One of `personal`, `shared`. |
  | `connectionType` | enum | no | Filters Jump Clients installers by the given connection type. One of `passive`, `active`, `uninstalled`. |
  | `installerId` | string | no | Filters Jump Clients installers by the installer id. |

  Optional query parameters are present but disabled; enable them when needed.

  **Responses**

  - 200: `JumpClientInstallerRetrievedDtoOutput[]`

  **Notes**

  - Records the request path in the monitoring table.
