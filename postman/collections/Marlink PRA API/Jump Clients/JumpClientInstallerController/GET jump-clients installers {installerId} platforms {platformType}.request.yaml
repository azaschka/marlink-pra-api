$kind: http-request
id: ad600b4f-a5ea-52ec-89e6-2d4db61fe875
name: GET /jump-clients/installers/:installerId/platforms/:platformType - Retrieve jump client installer platform
description: |-
  Retrieve jump client installer platform.

  | | |
  |---|---|
  | Source | `JumpClientInstallerController.retrieveJumpClientInstallerPlatform()` in `src/jump-client/controllers/jump-client-installer.controller.ts` (module `JumpClientModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Resolves the jump groups of the customers in scope; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `installerId` | string | yes | Id of the jump client installer. |
  | `platformType` | enum | yes | Path parameter platformType. One of `linux32-armv7`, `linux32-armv7-headless`, `linux64-x86`, `linux64-x86-headless`, `linux-64`, `linux-64-headless`, `raspberry-pi-32-headless`, `mac-dmg`, `mac-zip`, `mac-osx-x86`, `windows-64`, `windows-64-msi`, `winNT-64-msi`, `windows-32`, `windows-32-msi`, `winNT-32-msi`. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Responses**

  - 200

  **Notes**

  - Records the request path in the monitoring table.
  - Response: Installer file streamed from BeyondTrust; Content-Type and Content-Disposition are passed through. Use "Send and Download".
url: "{{baseUrl}}/jump-clients/installers/:installerId/platforms/:platformType"
method: GET
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    description: BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. Required.
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
pathVariables:
  - key: installerId
    value: "{{jumpClientInstallerId}}"
    description: Id of the jump client installer. Required.
  - key: platformType
    value: windows-64-msi
    description: "Path parameter platformType. One of: linux32-armv7, linux32-armv7-headless, linux64-x86, linux64-x86-headless, linux-64, linux-64-headless, raspberry-pi-32-headless, mac-dmg, mac-zip, mac-osx-x86, windows-64, windows-64-msi, winNT-64-msi, windows-32, windows-32-msi, winNT-32-msi. Required."
order: 5000
