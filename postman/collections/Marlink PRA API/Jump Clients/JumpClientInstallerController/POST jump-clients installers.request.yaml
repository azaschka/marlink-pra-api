$kind: http-request
id: fe362c26-153d-5086-9deb-1dd559e0dc72
name: POST /jump-clients/installers - Create jump client installer
description: |-
  Create jump client installer.

  | | |
  |---|---|
  | Source | `JumpClientInstallerController.createJumpClientInstaller()` in `src/jump-client/controllers/jump-client-installer.controller.ts` (module `JumpClientModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Resolves the jump groups of the customers in scope; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `CreateJumpClientInstallerDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `name` | string | no | yes | The name for the Jump Clients deployed using this installer. If left blank, the Jump Client name will be set to the name of the computer on which the installer is deployed. |
  | `jumpGroupId` | integer | yes | no | The shared Jump Group that will own the Jump Clients deployed using this installer. Rules: not empty. |
  | `jumpGroupType` | enum | no | yes | The type of Jump Group that owns this Jump Clients. One of `personal`, `shared`. |
  | `jumpPolicyId` | integer | no | yes | The unique identifier of the Jump Policy used to manage access to the Jump Client. |
  | `tag` | string | yes | no | The tag for the Jump Clients deployed using this installer. Mandatory. The value is normalized to the canonical form: whitespace and hyphens become underscores, special characters are mapped or removed, only A-Z, 0-9 and _ remain, and the result is UPPERCASE. A tag that is empty after normalization is rejected. Rules: not empty. Normalised by a @Transform rule before validation. |
  | `connectionType` | enum | no | yes | The type of Jump Client to deploy. Cloud deployments only allow active installers. One of `passive`, `active`, `uninstalled`. |
  | `sessionPolicyId` | integer | no | yes | The session policy used on the Jump Client system. |
  | `comments` | string | no | yes | The comments for the Jump Clients deployed using this installer. |
  | `validDurationInMinutes` | integer | no | yes | The number of minutes that the installer will be valid after it is downloaded. When the installer expires it can no longer be used to deploy new jump clients. |
  | `shouldElevateInstall` | boolean | no | yes | If true, the installer will attempt to elevate the Jump Client to make it run as a service. |
  | `shouldElevatePrompt` | boolean | no | yes | If true, the installer will prompt for elevation credentials if necessary. This parameter is ignored if shouldElevateInstall is false. |
  | `canOverrideJumpGroup` | boolean | no | yes | If true, the jump group can be specified during installation, which will override the jump group id specified in this API call. |
  | `canOverrideJumpPolicy` | boolean | no | yes | If true, the jump policy can be specified during installation, which will override the jump policy id specified in this API call. |
  | `canOverrideName` | boolean | no | yes | If true, the name can be specified during installation, which will override the name specified in this API call. |
  | `canOverrideTag` | boolean | no | yes | If true, the tag can be specified during installation, which will override the tag specified in this API call. |
  | `canOverrideComments` | boolean | no | yes | If true, the comments can be specified during installation, which will override the comments specified in this API call. |
  | `canOverrideSessionPolicy` | boolean | no | yes | If true, the session policy can be specified during installation, which will override the value specified in this API call. |
  | `jumpointProxy` | string | no | yes | The name of the Jumpoint. It must be online with Jump Zone Proxy enabled. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the Jump Client installer was created successfully and contains the installer identifier and key information. `JumpClientInstallerCreatedDtoOutput`
  - 409: A Jump Client installer already exists.
  - 422: One or more request parameters are invalid. The body contains a general error message as well as a validation error dictionary.

  **Notes**

  - Records the request path in the monitoring table.
url: "{{baseUrl}}/jump-clients/installers"
method: POST
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    description: BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. Required.
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
body:
  type: json
  content: |-
    {
      "jumpGroupId": 1,
      "tag": "example-tag"
    }
examples: ./.resources/POST jump-clients installers.resources/examples
