name: GET /logs - Retrieve logs
description: |-
  Retrieve logs.

  | | |
  |---|---|
  | Source | `LogController.retrieveLogs()` in `src/log/controllers/log.controller.ts` (module `LogModule`) |
  | Authentication | None. The route has no authentication guard. |
  | Swagger | documented in /open-api |
  | Customer export | not included. Folder Logs and Monitoring: platform operations for the PRA Console and operations only. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Query parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `pageSize` | integer | no | The number of items to include in a paginated response. Default `100`. |
  | `pageNumber` | integer | no | The 1-based index of the desired page. Default `1`. |
  | `searchString` | string | no | A search string to filter logs by service name, action name, or transaction ID. |
  | `creationDateFrom` | string | no | The earliest creation date of the logs to retrieve. Format: date-time. |
  | `creationDateTo` | string | no | The latest creation date of the logs to retrieve. Format: date-time. |
  | `sortOrderType` | enum | no | The order in which to sort the logs. One of `asc`, `desc`. Default `desc`. |
  | `tenantId` | integer | no | The tenant ID to filter logs for multi-tenant scenarios. |

  Optional query parameters are present but disabled; enable them when needed.

  **Responses**

  - 200: `LogsRetrievedDtoOutput`

  **Notes**

  - Records the request path in the monitoring table.

  **Contract notes** (effective behaviour in code versus Swagger metadata)

  - No authentication guard: the route is reachable without credentials (code-verified).
