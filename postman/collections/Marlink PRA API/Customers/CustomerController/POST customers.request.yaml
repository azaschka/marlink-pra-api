$kind: http-request
id: 96710b84-b3c5-5aac-bd7a-ab52636bbd70
name: POST /customers - Create customer
description: |-
  Create customer.

  | | |
  |---|---|
  | Source | `CustomerController.createCustomer()` in `src/customer/controllers/customer.controller.ts` (module `CustomerModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - The access key must define at least one business unit (403 otherwise).
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `CreateCustomerDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `key` | string | yes | no | Unique key for the customer. Rules: not empty. Normalised by a @Transform rule before validation. |
  | `name` | string | yes | no | Unique name of the customer. Rules: not empty. Normalised by a @Transform rule before validation. |
  | `businessUnit` | enum | yes | no | Business unit of the customer. One of `MT`, `OA`, `MC`, `EG`, `TE`. Rules: not empty. |
  | `beyondtrustInstanceId` | number | yes | no | The identifier of the BeyondTrust instance associated with this customer. Rules: not empty. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the customer was created successfully and contains the new customer. `CustomerCreatedDtoOutput`
  - 409: The specified customer already exists.
  - 422: Failed in downstream process. Most likely in creating admin group policy.

  **Notes**

  - Records the request path in the monitoring table.
url: "{{baseUrl}}/customers"
method: POST
headers:
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
body:
  type: json
  content: |-
    {
      "key": "EXAMPLE_KEY",
      "name": "Example name",
      "businessUnit": "MT",
      "beyondtrustInstanceId": 1
    }
