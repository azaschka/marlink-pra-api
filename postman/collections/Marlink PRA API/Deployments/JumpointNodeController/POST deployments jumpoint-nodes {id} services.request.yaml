  **Body** (`application/json`, `CreateJumpointNodeServiceDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `serviceType` | enum | yes | no | The type of the service. One of `pra`. Rules: not empty. |

