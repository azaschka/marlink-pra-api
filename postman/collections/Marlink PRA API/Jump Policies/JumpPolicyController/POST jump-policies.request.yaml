$kind: http-request
id: 2c99608e-0276-5e7a-a811-3d6a13d8a98c
name: POST /jump-policies - Create jump policy
description: |-
  Create jump policy.

  | | |
  |---|---|
  | Source | `JumpPolicyController.createJumpPolicy()` in `src/jump-policy/controllers/jump-policy.controller.ts` (module `JumpPolicyModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - Resolves the customers of the access key business units; 403 when there are none.
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Tenant-Id` | integer | yes | BeyondTrust instance id (not a customer id). The handler reads it; configure the tenantId variable once, it is never defaulted. |
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `CreateJumpPolicyDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `displayName` | string | yes | no | The display name of the Jump Policy. Rules: not empty. |
  | `codeName` | string | no | yes | The code name of the Jump Policy. |
  | `description` | string | no | yes | The Jump Policy's comments. |
  | `hasScheduledAccessRestriction` | boolean | no | yes | If true, users are restricted to accessing Jump Items within the scheduled hours. This setting cannot be enabled when require approval is true. |
  | `simultaneousJumpsType` | enum | no | yes | If set to join, once the first user is in a session, subsequent users will be able to enter the session. The first user will receive a notification that another user has joined the session, but the first user will not have an opportunity to deny access before other user joins. Selecting the global value means that the behavior defined in Jump Items will be used. One of `global`, `join`, `disallow`. |
  | `doesSimultaneousJumpBehaviorApplyToCopies` | boolean | no | yes | This field is only valid if simultaneousJumpsType is set to join; otherwise, this field should be set to false or left unset. If true, a user will be allowed to join a session that was started from another copy of a Jump Client in a different Jump Group. Session permissions will be based on the original Jump Client that started the session. If false, a user will not be allowed to join a session that was started from another copy of a Jump Item unless it is the same Jump Group. |
  | `simultaneousJumpsRdpType` | enum | no | yes | If set to new-session, then a new independent session will start for each user which jumps to a specific RDP Jump Item, and the RDP configuration on the endpoint will control any further behavior regarding simultaneous RDP connections. Selecting the global value means that the behavior defined in Jump Items will be used. One of `global`, `new-session`, `disallow`. |
  | `shouldForceRemoveUsersWhenScheduleDisallows` | boolean | no | yes | If true, users are forcefully removed from sessions when the schedule does not permit access. This can only be set to true if hasScheduledAccessRestriction is also true. |
  | `isTicketIdRequired` | boolean | no | yes | If true, users must enter a valid ticket ID that will be verified against the Ticket System configured in the Jump Policies. This setting has no effect if a Ticket System is not configured. |
  | `isTwoFactorChallengeRequired` | boolean | no | yes | If true, users must have two factor authentication enabled and must complete a two factor challenge before starting a session. |
  | `isSessionStartNotificationEnabled` | boolean | no | yes | If true, an email notification is sent to the configured recipients when a session starts. |
  | `isSessionEndNotificationEnabled` | boolean | no | yes | If true, an email notification is sent to the configured recipients when a session ends. |
  | `notificationEmailAddresses` | array<string> | no | yes | The list of email addresses to which session start and session end notifications will be sent. Required only if one or more notifications are enabled. The site must have an SMTP server configured on the Email Configuration. Rules: unique items. |
  | `notificationDisplayName` | string | no | yes | The display name of the recipients shown to users. Required in POST only if one or more notifications are enabled. |
  | `notificationEmailLanguage` | string | no | yes | The language in which notification emails will be sent. Must be the locale code for one of the locales listed. |
  | `isApprovalRequired` | boolean | no | yes | If true, users must wait for approval from one of the approvers before they can start a session. This setting cannot be enabled when hasScheduledAccessRestriction is true. |
  | `approvalMaxDurationInMinutes` | number | no | yes | The number of minutes a user is allowed to access the Jump Item after approval is granted. The maximum is 52 weeks in minutes. |
  | `approvalScopeType` | enum | no | yes | The scope of access granted by approvals. If "requestor", only the requestor has access. If "anyone", anyone who is permitted to request access has access. One of `requestor`, `anyone`. |
  | `approvalEmailAddresses` | array<string> | no | yes | The list of email addresses to which approval requests will be sent. It is required only if approvals are enabled. The site must have an SMTP server configured on the Email Configuration. Rules: unique items. |
  | `approvalUserIds` | array<string> | no | yes | The list of user ids to which approval requests will be sent. It is required only if approvals are enabled. Rules: unique items. |
  | `approvalTeamIds` | array<string> | no | yes | The list of team ids to which approval requests will be sent. It is required only if approvals are enabled. Rules: unique items. |
  | `approvalDisplayName` | string | no | yes | The display name of the approvers that requestors will see. It is required only if approvals are enabled. |
  | `approvalEmailLanguage` | string | no | yes | The language in which approval emails will be sent. Must be the locale code for one of the locales listed. |
  | `approvalApproverScopeType` | enum | no | yes | The scope of approval granted to approvers. If "not-requestor", then the approver cannot approve their own requests. If "anyone", anyone who is permitted to approve, can approve requests, including their own. One of `not-requestor`, `anyone`. |
  | `isRecordingsDisabled` | boolean | no | yes | If true, sessions will not be recorded even if recordings configurations are enabled. This affects Screen Sharing, User Recordings for Protocol Tunnel Jump, and Shell recordings. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the jump policy was created successfully and contains the new instance. `JumpPolicyCreatedDtoOutput`
  - 422: One or more request parameters are invalid. The body contains a general error message as well as a validation error dictionary.

  **Notes**

  - Records the request path in the monitoring table.
