$kind: http-request
id: 306f6d57-2e26-559b-bdde-8e03beffe3af
name: GET /beyondtrust-instances/:id/backups/:backupId/content - Retrieve beyondtrust instance backup content
description: |-
  Retrieve beyondtrust instance backup content.

  | | |
  |---|---|
  | Source | `BeyondtrustInstanceBackupController.retrieveBeyondtrustInstanceBackupContent()` in `src/beyondtrust-instance-backup/controllers/beyondtrust-instance-backup.controller.ts` (module `BeyondtrustInstanceBackupModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `id` | integer | yes | Unique identifier for the resource. |
  | `backupId` | integer | yes | Unique identifier for the backup. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Responses**

  - 200: Returns the content of the backup file. `Buffer`
  - 404: Indicates either the resource or the backup file was not found.

  **Notes**

  - Records the request path in the monitoring table.
  - Response: application/octet-stream (BeyondTrust configuration backup file). Use "Send and Download" in Postman.
url: "{{baseUrl}}/beyondtrust-instances/:id/backups/:backupId/content"
method: GET
headers:
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional correlation id for tracing a request across services and logs. Generated by the API when absent.
pathVariables:
  - key: id
    value: "{{beyondtrustInstanceId}}"
    description: Unique identifier for the resource. Required.
  - key: backupId
    value: "{{backupId}}"
    description: Unique identifier for the backup. Required.
order: 4000
