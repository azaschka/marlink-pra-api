$kind: http-request
id: 6e48bbf7-0ed9-52ee-9f9c-1c12d05a8fba
name: PATCH /beyondtrust-instances/:id - Modify beyondtrust instance
description: |-
  Modify beyondtrust instance.

  | | |
  |---|---|
  | Source | `BeyondtrustInstanceController.modifyBeyondtrustInstance()` in `src/beyondtrust-instance/controllers/beyondtrust-instance.controller.ts` (module `BeyondtrustInstanceModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - The access key must define at least one business unit (403 otherwise).
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Path parameters**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `id` | integer | yes | Unique identifier for the resource. |

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `ModifyBeyondtrustInstanceDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `name` | string | no | yes | The display name of the BeyondTrust instance. |
  | `authClientId` | string | no | yes | The client id to be authenticated by BeyondTrust system. |
  | `authClientSecret` | string | no | yes | The client secret to be authenticated by BeyondTrust system. |
  | `oauth2TokenUrl` | string | no | yes | The url to retrieve BeyondTrust OAuth2 token. |
  | `apiBaseUrl` | string | no | yes | The base url of the BeyondTrust PRA Configuration API. |
  | `billingType` | enum | no | yes | Billing type of the BeyondTrust instance. One of `user`, `asset`. |
  | `businessUnit` | enum | no | yes | Business unit of the BeyondTrust instance. Set to null to make shared. One of `MT`, `OA`, `MC`, `EG`, `TE`. |
  | `cname` | string | no | yes | The CNAME (full HTTPS URL) displayed to end-users as the BT console login URL in activation emails. Format: uri. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.
  - Every field is optional, but an empty object is rejected (NonEmptyBodyPipe). The minimal body therefore sends one field (`name`); send only the fields you want to change.

  **Responses**

  - 200: Indicates the BeyondTrust instance was successfully updated and contains the updated BeyondTrust instance. `BeyondtrustInstanceModifiedDtoOutput`
  - 404: The specified resource was not found.

  **Notes**

  - Records the request path in the monitoring table.
url: "{{baseUrl}}/beyondtrust-instances/:id"
method: PATCH
headers:
  - key: X-Transaction-Id
    value: "{{transactionId}}"
