$kind: http-request
id: 0557d486-811a-5bf3-88c6-be5fa945cda4
name: POST /beyondtrust-instances - Create beyondtrust instance
description: |-
  Create beyondtrust instance.

  | | |
  |---|---|
  | Source | `BeyondtrustInstanceController.createBeyondtrustInstance()` in `src/beyondtrust-instance/controllers/beyondtrust-instance.controller.ts` (module `BeyondtrustInstanceModule`) |
  | Authentication | X-Access-Key header (`{{accessKey}}`) |
  | Swagger | documented in /open-api |
  | Customer export | included |

  **Authorisation and scope**

  - X-Access-Key must match a configured access entry; its business units define the scope.
  - The access key must define at least one business unit (403 otherwise).
  - Checks that the addressed resource and the filters belong to the business units or customers of the access key (403 otherwise).

  **Headers**

  | Name | Type | Required | Details |
  |---|---|---|---|
  | `X-Transaction-Id` | string | no | Optional correlation id for tracing a request across services and logs. Generated by the API when absent. |

  Optional headers are present but disabled; enable them when needed.

  **Body** (`application/json`, `CreateBeyondtrustInstanceDtoInput`, validated by ValidationPipe)

  | Field | Type | Required | Null accepted | Details |
  |---|---|---|---|---|
  | `name` | string | yes | no | The display name of the BeyondTrust instance. Rules: not empty. |
  | `authClientId` | string | yes | no | The client id to be authenticated by BeyondTrust system. Rules: not empty. |
  | `authClientSecret` | string | yes | no | The client secret to be authenticated by BeyondTrust system. Rules: not empty. |
  | `oauth2TokenUrl` | string | yes | no | The url to retrieve BeyondTrust OAuth2 token. Rules: not empty. |
  | `apiBaseUrl` | string | yes | no | The base url of the BeyondTrust PRA Configuration API. Rules: not empty. |
  | `billingType` | enum | yes | no | Billing type of the BeyondTrust instance. One of `user`, `asset`. Rules: not empty. |
  | `businessUnit` | enum | no | yes | Business unit of the BeyondTrust instance. Omit or set to null for shared instances visible to all BUs. One of `MT`, `OA`, `MC`, `EG`, `TE`. |
  | `cname` | string | yes | no | The CNAME (full HTTPS URL) displayed to end-users as the BT console login URL in activation emails. Format: uri. Rules: not empty. |

  - The request body is the minimal valid body: required fields only.
  - The saved example "Full body" sends every writable field with representative nested objects and arrays.
  - JSON properties cannot be disabled individually: delete optional properties you do not want to send. Omitting a property and sending `null` are different; "Null accepted" shows what validation allows.

  **Responses**

  - 201: Indicates the BeyondTrust instance was created successfully and contains the new BeyondTrust instance. `BeyondtrustInstanceCreatedDtoOutput`

  **Notes**

  - Records the request path in the monitoring table.
