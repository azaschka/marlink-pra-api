        "comments": "string",
        "rdpUsername": "string",
        "domain": "string",
        "jumpPolicyId": 3509.4731414900493,
        "isSessionForensicsEnabled": true,
        "sessionPolicyId": 1844.3173322286023,
        "secureAppType": "remote-app",
        "remoteAppName": "string",
        "remoteAppParams": "string",
        "remoteExePath": "string",
        "remoteExeParams": "string",
