$kind: http-example
name: A Remote VNC Jump Item already exists.
request:
  url: "{{baseUrl}}/jump-items/remote-vncs"
  method: POST
  headers:
    - key: X-Access-Key
      value: string
      description: Access key for authenticating and authorizing requests.
    - key: X-Transaction-Id
      value: string
      description: Optional identifier for tracing and correlating a transaction
        across services and logs.
    - key: X-Tenant-Id
      value: "15.767170974738676"
      description: The identifier for the tenant making the request.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "jumpointId": 779.172738866396,
        "hostname": "string",
        "jumpGroupId": 3964.2755357416017,
        "port": 4496.203594793787,
        "jumpGroupType": "personal",
        "tag": "string",
        "comments": "string",
        "jumpPolicyId": 9552.841610976553,
        "sessionPolicyId": 9063.816656280345
      }
response:
  statusCode: 409
  statusText: Conflict
  body:
    type: text
    content: ""
order: 2000
