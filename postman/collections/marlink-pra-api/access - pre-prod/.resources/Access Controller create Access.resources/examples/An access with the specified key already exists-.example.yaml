$kind: http-example
name: An access with the specified key already exists.
request:
  url: "{{baseUrl}}/access"
  method: POST
  headers:
    - key: X-Transaction-Id
      value: string
      description: Optional identifier for tracing and correlating a transaction
        across services and logs.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "key": "string",
        "name": "string",
        "value": {
          "businessUnits": [
            "DI",
            "TE"
          ]
        }
      }
response:
  statusCode: 409
  statusText: Conflict
  body:
    type: text
    content: ""
order: 2000
