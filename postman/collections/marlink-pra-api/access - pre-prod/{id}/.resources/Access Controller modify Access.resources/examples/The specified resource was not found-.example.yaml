$kind: http-example
name: The specified resource was not found.
request:
  url: "{{baseUrl}}/access/:id"
  method: PATCH
  headers:
    - key: X-Transaction-Id
      value: string
      description: Optional identifier for tracing and correlating a transaction
        across services and logs.
    - key: Content-Type
      value: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "key": "string",
        "name": "string",
        "value": {
          "businessUnits": [
            "MC",
            "MT"
          ]
        }
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 2000
