$kind: http-request
url: "{{baseUrl}}/access"
method: POST
headers:
  - key: X-Transaction-Id
    value: string
    description: Optional identifier for tracing and correlating a transaction
      across services and logs.
    $type: string
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "key": "string",
      "name": "string",
      "value": {
        "businessUnits": [
          "DI",
          "TE"
        ]
      }
    }
  $type: >-
    {
      "type": "object",
      "properties": {
        "key": {
          "type": "string",
          "description": "The key of the access."
        },
        "name": {
          "type": "string",
          "description": "The name of the access."
        },
        "value": {
          "description": "The access.",
          "allOf": [
            {
              "type": "object",
              "properties": {
                "businessUnits": {
                  "type": "array",
                  "description": "The business units included in the access scope.",
                  "items": {
                    "type": "string"
                  }
                }
              },
              "required": [
                "businessUnits"
              ]
            }
          ]
        }
      },
      "required": [
        "key",
        "name",
        "value"
      ]
    }
examples: ./.resources/Access Controller create Access.resources/examples
order: 3000
