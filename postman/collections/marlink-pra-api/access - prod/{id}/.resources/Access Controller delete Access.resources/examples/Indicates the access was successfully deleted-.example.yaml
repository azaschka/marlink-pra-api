$kind: http-example
name: Indicates the access was successfully deleted.
request:
  url: "{{baseUrl}}/access/:id"
  method: DELETE
  headers:
    - key: X-Transaction-Id
      value: string
      description: Optional identifier for tracing and correlating a transaction
        across services and logs.
  pathVariables:
    id: ""
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
