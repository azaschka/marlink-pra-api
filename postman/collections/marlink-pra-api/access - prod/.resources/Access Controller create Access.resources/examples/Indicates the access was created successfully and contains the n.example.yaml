$kind: http-example
name: Indicates the access was created successfully and contains the new access.
request:
  url: "{{baseUrl}}/access"
  method: POST
  headers:
    - key: X-Transaction-Id
      value: string
      description: Optional identifier for tracing and correlating a transaction
        across services and logs.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "key": "string",
        "name": "string",
        "value": {
          "businessUnits": [
            "DI",
            "TE"
          ]
        }
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 6966.377983578614,
        "key": "string",
        "name": "string",
        "value": {
          "businessUnits": [
            "TE",
            "DI"
          ]
        },
        "creationDate": "1997-08-02T20:28:41.788Z",
        "lastModificationDate": "1987-06-11T04:35:45.287Z"
      }
order: 1000
