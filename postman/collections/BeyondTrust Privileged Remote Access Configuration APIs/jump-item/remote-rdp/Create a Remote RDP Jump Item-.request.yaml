$kind: http-request
name: Create a Remote RDP Jump Item.
description: |
  Adds a new Remote RDP Jump Item resource.
  The response body contains the new Remote RDP Jump Item.
url: "{{baseUrl}}/jump-item/remote-rdp"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "jumpoint_id": "<integer>",
      "hostname": "<string>",
      "jump_group_id": "<integer>",
      "jump_group_type": "shared",
      "quality": "video",
      "console": false,
      "ignore_untrusted": false,
      "tag": "<string>",
      "comments": "<string>",
      "rdp_username": "<string>",
      "domain": "<string>",
      "jump_policy_id": "<integer>",
      "session_forensics": false,
      "session_policy_id": "<integer>",
      "secure_app_type": "remote_app",
      "remote_app_name": "<string>",
      "remote_app_params": "<string>",
      "remote_exe_path": "<string>",
      "remote_exe_params": "<string>",
      "target_system": "<string>",
      "credential_type": "<string>"
    }
examples: ./.resources/Create a Remote RDP Jump Item-.resources/examples
order: 3000
