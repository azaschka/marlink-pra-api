$kind: http-request
name: Get a Web Jump Item.
description: Gets the Web Jump Item resource with the given `{id}`.
url: "{{baseUrl}}/jump-item/web-jump/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Get a Web Jump Item-.resources/examples
order: 2000
