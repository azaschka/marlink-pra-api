$kind: http-request
name: Delete a Web Jump Item resource.
description: Deletes an existing Web Jump Item resource with the given `{id}`.
url: "{{baseUrl}}/jump-item/web-jump/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Delete a Web Jump Item resource-.resources/examples
order: 3000
