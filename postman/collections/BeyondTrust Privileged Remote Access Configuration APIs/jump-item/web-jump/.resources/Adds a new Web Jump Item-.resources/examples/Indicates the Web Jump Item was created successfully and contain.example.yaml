$kind: http-example
name: Indicates the Web Jump Item was created successfully and contains the new
  instance. The `Location` header contains the URL of the item.
request:
  url: "{{baseUrl}}/jump-item/web-jump"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "jumpoint_id": "<integer>",
        "url": "<string>",
        "jump_group_id": "<integer>",
        "username_format": "default",
        "verify_certificate": true,
        "jump_group_type": "shared",
        "authentication_timeout": 3,
        "tag": "<string>",
        "comments": "<string>",
        "jump_policy_id": "<integer>",
        "username_field": "<string>",
        "password_field": "<string>",
        "submit_field": "<string>",
        "session_policy_id": "<integer>"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "jumpoint_id": "<integer>",
        "url": "<string>",
        "jump_group_id": "<integer>",
        "id": "<integer>",
        "username_format": "default",
        "verify_certificate": true,
        "jump_group_type": "shared",
        "authentication_timeout": 3,
        "tag": "<string>",
        "comments": "<string>",
        "jump_policy_id": "<integer>",
        "username_field": "<string>",
        "password_field": "<string>",
        "submit_field": "<string>",
        "session_policy_id": "<integer>"
      }
order: 1000
