$kind: http-example
request:
  url: "{{baseUrl}}/jump-item/web-jump?per_page=<integer>&current_page=<integer>&\
    name=<string>&url=<string>&jump_group_id=<integer>&jump_group_type=personal\
    &jumpoint_id=<integer>&tag=<string>"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: per_page
      value: <integer>
      description: The number of items to include a paginated response.
    - key: current_page
      value: <integer>
      description: The 1-based index of the desired page.
    - key: name
      value: <string>
      description: Filters results to include only web jump items with the given name.
    - key: url
      value: <string>
      description: Filters results to include only the web jump items with the given url.
    - key: jump_group_id
      value: <integer>
      description: Filters results to include only the web jump items with the given
        Jump Group id.
    - key: jump_group_type
      value: personal
      description: Filters results to include only the web jump items with the given
        Jump Group type.
    - key: jumpoint_id
      value: <integer>
      description: Filters results to include only the web jump items with the given
        Jumpoint id.
    - key: tag
      value: <string>
      description: Filters results to include only the web jump items with the given tag.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    Link: ""
    X-BT-Pagination-Current-Page: ""
    X-BT-Pagination-Per-Page: ""
    X-BT-Pagination-Last-Page: ""
    X-BT-Pagination-Total: ""
  body:
    type: json
    content: |-
      [
        {
          "name": "<string>",
          "jumpoint_id": "<integer>",
          "url": "<string>",
          "jump_group_id": "<integer>",
          "id": "<integer>",
          "username_format": "default",
          "verify_certificate": true,
          "jump_group_type": "shared",
          "authentication_timeout": 3,
          "tag": "<string>",
          "comments": "<string>",
          "jump_policy_id": "<integer>",
          "username_field": "<string>",
          "password_field": "<string>",
          "submit_field": "<string>",
          "session_policy_id": "<integer>"
        },
        {
          "name": "<string>",
          "jumpoint_id": "<integer>",
          "url": "<string>",
          "jump_group_id": "<integer>",
          "id": "<integer>",
          "username_format": "default",
          "verify_certificate": true,
          "jump_group_type": "shared",
          "authentication_timeout": 3,
          "tag": "<string>",
          "comments": "<string>",
          "jump_policy_id": "<integer>",
          "username_field": "<string>",
          "password_field": "<string>",
          "submit_field": "<string>",
          "session_policy_id": "<integer>"
        }
      ]
order: 1000
