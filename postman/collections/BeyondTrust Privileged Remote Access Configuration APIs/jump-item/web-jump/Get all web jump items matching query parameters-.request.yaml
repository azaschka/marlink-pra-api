$kind: http-request
name: Get all web jump items matching query parameters.
description: Gets a paginated list of Web Jump Items.
url: "{{baseUrl}}/jump-item/web-jump?per_page=<integer>&current_page=<integer>&\
  name=<string>&url=<string>&jump_group_id=<integer>&jump_group_type=personal&j\
  umpoint_id=<integer>&tag=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: per_page
    value: <integer>
    description: The number of items to include a paginated response.
  - key: current_page
    value: <integer>
    description: The 1-based index of the desired page.
  - key: name
    value: <string>
    description: Filters results to include only web jump items with the given name.
  - key: url
    value: <string>
    description: Filters results to include only the web jump items with the given url.
  - key: jump_group_id
    value: <integer>
    description: Filters results to include only the web jump items with the given
      Jump Group id.
  - key: jump_group_type
    value: personal
    description: Filters results to include only the web jump items with the given
      Jump Group type.
  - key: jumpoint_id
    value: <integer>
    description: Filters results to include only the web jump items with the given
      Jumpoint id.
  - key: tag
    value: <string>
    description: Filters results to include only the web jump items with the given tag.
examples: ./.resources/Get all web jump items matching query
  parameters-.resources/examples
order: 2000
