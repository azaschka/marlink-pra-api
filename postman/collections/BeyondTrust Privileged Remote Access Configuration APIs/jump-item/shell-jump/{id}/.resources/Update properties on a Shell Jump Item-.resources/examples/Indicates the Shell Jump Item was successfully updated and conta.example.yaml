$kind: http-example
name: Indicates the Shell Jump Item was successfully updated and contains an
  updated Shell Jump Item instance.
request:
  url: "{{baseUrl}}/jump-item/shell-jump/:id"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "jumpoint_id": "<integer>",
        "hostname": "<string>",
        "protocol": "ssh",
        "jump_group_id": "<integer>",
        "port": "SSH: 22, Telnet: 23",
        "jump_group_type": "shared",
        "terminal": "xterm",
        "keep_alive": "<integer>",
        "tag": "<string>",
        "comments": "<string>",
        "jump_policy_id": "<integer>",
        "username": "<string>",
        "session_policy_id": "<integer>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "jumpoint_id": "<integer>",
        "hostname": "<string>",
        "protocol": "ssh",
        "jump_group_id": "<integer>",
        "id": "<integer>",
        "port": "SSH: 22, Telnet: 23",
        "jump_group_type": "shared",
        "terminal": "xterm",
        "keep_alive": "<integer>",
        "tag": "<string>",
        "comments": "<string>",
        "jump_policy_id": "<integer>",
        "username": "<string>",
        "session_policy_id": "<integer>"
      }
order: 1000
