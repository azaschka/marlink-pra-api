$kind: http-request
name: Delete a Shell Jump Item resource.
description: Deletes an existing Shell Jump Item resource with the given `{id}`.
url: "{{baseUrl}}/jump-item/shell-jump/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Delete a Shell Jump Item resource-.resources/examples
order: 4000
