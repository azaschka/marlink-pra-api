$kind: http-request
name: Get a Shell Jump Item.
description: Gets the Shell Jump Item resource with the given `{id}`.
url: "{{baseUrl}}/jump-item/shell-jump/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
