$kind: http-request
name: Adds a new Shell Jump Item.
description: Creates a new Shell Jump Item with the properties given in the request body.
url: "{{baseUrl}}/jump-item/shell-jump"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "jumpoint_id": "<integer>",
      "hostname": "<string>",
      "protocol": "ssh",
      "jump_group_id": "<integer>",
      "port": "SSH: 22, Telnet: 23",
      "jump_group_type": "shared",
      "terminal": "xterm",
      "keep_alive": "<integer>",
      "tag": "<string>",
      "comments": "<string>",
      "jump_policy_id": "<integer>",
      "username": "<string>",
      "session_policy_id": "<integer>"
    }
examples: ./.resources/Adds a new Shell Jump Item-.resources/examples
order: 3000
