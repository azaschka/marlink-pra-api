$kind: http-request
name: Adds a new Protocol Tunnel Jump Item.
description: Creates a new Protocol Tunnel Jump Item with the properties given
  in the request body.
url: "{{baseUrl}}/jump-item/protocol-tunnel-jump"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "jumpoint_id": "<integer>",
      "hostname": "<string>",
      "jump_group_id": "<integer>",
      "jump_group_type": "shared",
      "tag": "<string>",
      "comments": "<string>",
      "jump_policy_id": "<integer>",
      "session_policy_id": "<integer>",
      "tunnel_listen_address": "127.0.0.1",
      "tunnel_definitions": "<string>",
      "tunnel_type": "tcp",
      "username": "<string>",
      "database": "<string>",
      "url": "<string>",
      "ca_certificates": "<string>"
    }
examples: ./.resources/Adds a new Protocol Tunnel Jump Item-.resources/examples
order: 3000
