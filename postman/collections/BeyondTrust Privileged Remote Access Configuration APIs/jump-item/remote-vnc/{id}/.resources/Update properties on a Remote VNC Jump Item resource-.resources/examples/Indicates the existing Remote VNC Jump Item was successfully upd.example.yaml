$kind: http-example
name: Indicates the existing Remote VNC Jump Item was successfully updated and
  returns the updated Remote VNC Jump Item.
request:
  url: "{{baseUrl}}/jump-item/remote-vnc/:id"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "hostname": "<string>",
        "jumpoint_id": "<integer>",
        "jump_group_id": "<integer>",
        "port": 5900,
        "jump_group_type": "shared",
        "tag": "<string>",
        "comments": "<string>",
        "jump_policy_id": "<integer>",
        "session_policy_id": "<integer>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "hostname": "<string>",
        "jumpoint_id": "<integer>",
        "jump_group_id": "<integer>",
        "id": "<integer>",
        "port": 5900,
        "jump_group_type": "shared",
        "tag": "<string>",
        "comments": "<string>",
        "jump_policy_id": "<integer>",
        "session_policy_id": "<integer>"
      }
order: 1000
