$kind: http-example
name: Indicates the Remote VNC Jump Item was successfully copied.
request:
  url: "{{baseUrl}}/jump-item/remote-vnc/:id/copy"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "jump_group_id": "<integer>",
        "jump_group_type": "personal",
        "name": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "action": "<string>",
        "success": "<string>",
        "destId": "<integer>"
      }
order: 1000
