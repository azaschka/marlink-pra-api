$kind: http-request
name: Adds a new Network Tunnel Jump Item.
description: Creates a new Network Tunnel Jump Item with the properties given in
  the request body.
url: "{{baseUrl}}/jump-item/network-tunnel-jump"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "jumpoint_id": "<integer>",
      "jump_group_id": "<integer>",
      "filter_rules": [
        {
          "ip_addresses": {
            "cidr": "<string>"
          },
          "protocol": "ANY",
          "ports": {
            "range": {
              "start": "<integer>",
              "end": "<integer>"
            }
          }
        }
      ],
      "jump_group_type": "shared",
      "tag": "<string>",
      "comments": "<string>",
      "jump_policy_id": "<integer>",
      "session_policy_id": "<integer>"
    }
examples: ./.resources/Adds a new Network Tunnel Jump Item-.resources/examples
order: 3000
