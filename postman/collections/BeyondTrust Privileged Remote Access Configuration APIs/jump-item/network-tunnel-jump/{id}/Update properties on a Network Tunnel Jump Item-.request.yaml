$kind: http-request
name: Update properties on a Network Tunnel Jump Item.
description: Modifies the existing Network Tunnel Jump Item resource with the given `{id}`.
url: "{{baseUrl}}/jump-item/network-tunnel-jump/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "jumpoint_id": "<integer>",
      "jump_group_id": "<integer>",
      "filter_rules": [
        {
          "ip_addresses": {
            "cidr": "<string>"
          },
          "protocol": "ANY",
          "ports": {
            "range": {
              "start": "<integer>",
              "end": "<integer>"
            }
          }
        }
      ],
      "jump_group_type": "shared",
      "tag": "<string>",
      "comments": "<string>",
      "jump_policy_id": "<integer>",
      "session_policy_id": "<integer>"
    }
examples: ./.resources/Update properties on a Network Tunnel Jump
  Item-.resources/examples
order: 3000
