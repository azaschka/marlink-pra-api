$kind: http-request
name: Get a list of Vendor Users in a Vendor Group.
description: Gets a paginated list of `VendorUser` resources representing users
  explicitly granted access to the vendor group with the given `{id}`.
url: "{{baseUrl}}/vendor/:id/user?per_page=<integer>&current_page=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: per_page
    value: <integer>
    description: The number of items to include a paginated response.
  - key: current_page
    value: <integer>
    description: The 1-based index of the desired page.
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Get a list of Vendor Users in a Vendor Group-.resources/examples
order: 2000
