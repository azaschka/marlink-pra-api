$kind: http-request
name: Reactivates a vendor user in a vendor group.
description: Reactivates a vendor user.
url: "{{baseUrl}}/vendor/:id/user/:user_id/reactivate"
method: POST
headers:
  Accept: application/json
pathVariables:
