$kind: http-request
name: Add a Vendor User to a Vendor Group.
description: Adds a vendor user.
url: "{{baseUrl}}/vendor/:id/user"
method: POST
headers:
  Content-Type: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
body:
  type: json
  content: |-
    {
      "username": "<string>",
      "public_display_name": "<string>",
      "password": "<string>",
      "email_address": "<string>",
      "password_expiration": "<dateTime>",
      "password_reset_next_login": false,
      "enabled": true,
      "preferred_email_language": "en-us"
    }
examples: ./.resources/Add a Vendor User to a Vendor Group-.resources/examples
order: 3000
