$kind: http-request
name: Get all Jump Group resources matching query parameters.
description: >
  Gets a paginated list of Jump Groups.


  They can optionally be filtered using query string parameters documented
  below. If more than one filter is specified, then AND logic is used to combine
  the criteria. If no filter criteria are specified, then all Jump Groups are
  returned. String parameters are always matched case-insensitively and exactly;
  no partial matches are allowed.
url: "{{baseUrl}}/jump-group?per_page=<integer>&current_page=<integer>&name=<st\
  ring>&code_name=cT4"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: per_page
    value: <integer>
    description: The number of items to include a paginated response.
  - key: current_page
    value: <integer>
    description: The 1-based index of the desired page.
  - key: name
    value: <string>
    description: Filters results to include only the Jump Group with the given name.
  - key: code_name
    value: cT4
    description: Filters a response to include only resources with the given code name.
examples: ./.resources/Get all Jump Group resources matching query
  parameters-.resources/examples
order: 2000
