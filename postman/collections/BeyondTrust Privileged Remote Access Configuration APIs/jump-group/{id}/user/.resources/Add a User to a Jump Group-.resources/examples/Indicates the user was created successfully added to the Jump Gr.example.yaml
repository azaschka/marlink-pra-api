$kind: http-example
name: Indicates the user was created successfully added to the Jump Group.
request:
  url: "{{baseUrl}}/jump-group/:id/user"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "user_id": "<integer>",
        "jump_item_role_id": "<integer>",
        "jump_policy_id": "<integer>"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "user_id": "<integer>",
        "jump_item_role_id": "<integer>",
        "jump_policy_id": "<integer>"
      }
order: 1000
