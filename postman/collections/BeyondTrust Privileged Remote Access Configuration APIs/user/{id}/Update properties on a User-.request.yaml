$kind: http-request
name: Update properties on a User.
description: >
  Modifies an existing user resource with the given `{id}`.

  The `failed_logins` property may be set to 0 to unlock a user account that has
  too many failed logins.
url: "{{baseUrl}}/user/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
body:
  type: json
  content: |-
    {
      "public_display_name": "<string>",
      "username": "<string>",
      "password": "<string>",
      "password_expiration": "<dateTime>",
      "email_address": "<string>",
      "preferred_email_language": "en-us",
      "two_factor_required": false,
      "enabled": true,
      "failed_logins": 0,
      "password_reset_next_login": false
    }
examples: ./.resources/Update properties on a User-.resources/examples
order: 4000
