$kind: http-request
name: Get a User.
description: Gets the user resource with the given `{id}`.
url: "{{baseUrl}}/user/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Get a User-.resources/examples
order: 3000
