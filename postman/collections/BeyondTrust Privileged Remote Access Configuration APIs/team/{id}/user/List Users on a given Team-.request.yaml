$kind: http-request
name: List Users on a given Team.
description: Get paginated list of users belonging to a team with the given `{id}`.
url: "{{baseUrl}}/team/:id/user?per_page=<integer>&current_page=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: per_page
    value: <integer>
    description: The number of items to include a paginated response.
  - key: current_page
    value: <integer>
    description: The 1-based index of the desired page.
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/List Users on a given Team-.resources/examples
order: 2000
