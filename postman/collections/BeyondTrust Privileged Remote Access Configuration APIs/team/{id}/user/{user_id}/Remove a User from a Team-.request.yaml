$kind: http-request
name: Remove a User from a Team.
description: Removes a user with the given `{user_id}` from the team with the given `{id}`.
url: "{{baseUrl}}/team/:id/user/:user_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
  - key: user_id
    value: <integer>
    description: (Required) The unique id of the user.
examples: ./.resources/Remove a User from a Team-.resources/examples
order: 3000
