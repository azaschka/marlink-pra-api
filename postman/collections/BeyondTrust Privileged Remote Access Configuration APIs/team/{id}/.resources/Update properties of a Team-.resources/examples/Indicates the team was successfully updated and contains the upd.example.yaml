$kind: http-example
name: Indicates the team was successfully updated and contains the updated team
  instance.
request:
  url: "{{baseUrl}}/team/:id"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "code_name": "3cTR",
        "comments": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "id": "<integer>",
        "code_name": "7",
        "comments": "<string>"
      }
order: 1000
