$kind: http-example
request:
  url: "{{baseUrl}}/team?per_page=<integer>&current_page=<integer>&name=<string>&\
    code_name=cT4"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: per_page
      value: <integer>
      description: The number of items to include a paginated response.
    - key: current_page
      value: <integer>
      description: The 1-based index of the desired page.
    - key: name
      value: <string>
      description: Filters results to include only the team with the given name.
    - key: code_name
      value: cT4
      description: Filters a response to include only resources with the given code name.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    Link: ""
    X-BT-Pagination-Current-Page: ""
    X-BT-Pagination-Per-Page: ""
    X-BT-Pagination-Last-Page: ""
    X-BT-Pagination-Total: ""
  body:
    type: json
    content: |-
      [
        {
          "name": "<string>",
          "id": "<integer>",
          "code_name": "rnn6IJH\\jMX",
          "comments": "<string>"
        },
        {
          "name": "<string>",
          "id": "<integer>",
          "code_name": "NwOHQ507",
          "comments": "<string>"
        }
      ]
order: 1000
