$kind: http-request
name: Get all API Accounts.
description: >
  Gets a paginated list of api account resources.


  They can optionally be filtered using query string parameters documented
  below. If no filter criteria are specified, then all api accounts are
  returned. String parameters are always matched case-insensitively and exactly;
  no partial matches are allowed.
url: "{{baseUrl}}/api-account?per_page=<integer>&current_page=<integer>&name=<s\
  tring>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: per_page
    value: <integer>
    description: The number of items to include a paginated response.
  - key: current_page
    value: <integer>
    description: The 1-based index of the desired page.
  - key: name
    value: <string>
    description: Filters results to include only api accounts with the given name.
examples: ./.resources/Get all API Accounts-.resources/examples
order: 1000
