$kind: http-request
name: Get a list of Users allowed to access a Jumpoint.
description: Gets a paginated list of `JumpointUser` resources representing
  users who are allowed to access the Jumpoint with the given `{id}`.
url: "{{baseUrl}}/jumpoint/:id/user?per_page=<integer>&current_page=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: per_page
    value: <integer>
    description: The number of items to include a paginated response.
  - key: current_page
    value: <integer>
    description: The 1-based index of the desired page.
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Get a list of Users allowed to access a
  Jumpoint-.resources/examples
order: 2000
