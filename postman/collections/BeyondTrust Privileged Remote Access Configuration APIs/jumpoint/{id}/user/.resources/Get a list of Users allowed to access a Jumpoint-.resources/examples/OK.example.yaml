$kind: http-example
request:
  url: "{{baseUrl}}/jumpoint/:id/user?per_page=<integer>&current_page=<integer>"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: per_page
      value: <integer>
      description: The number of items to include a paginated response.
    - key: current_page
      value: <integer>
      description: The 1-based index of the desired page.
  pathVariables:
    id: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "user_id": "<integer>"
      }
order: 1000
