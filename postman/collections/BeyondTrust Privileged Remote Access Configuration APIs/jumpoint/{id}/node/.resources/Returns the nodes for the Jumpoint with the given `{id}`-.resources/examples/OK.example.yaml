$kind: http-example
request:
  url: "{{baseUrl}}/jumpoint/:id/node"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    id: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "<integer>",
        "last_connect_timestamp": "<dateTime>",
        "last_disconnect_timestamp": "<dateTime>",
        "public_ip": "<string>",
        "private_ip": "<string>",
        "hostname": "<string>"
      }
order: 1000
