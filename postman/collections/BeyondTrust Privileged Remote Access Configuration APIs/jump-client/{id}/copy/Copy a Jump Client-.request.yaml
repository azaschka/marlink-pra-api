$kind: http-request
name: Copy a Jump Client.
description: Copies a Jump Client.
url: "{{baseUrl}}/jump-client/:id/copy"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
body:
  type: json
  content: |-
    {
      "jump_group_id": "<integer>",
      "jump_group_type": "personal",
      "name": "<string>"
    }
examples: ./.resources/Copy a Jump Client-.resources/examples
order: 1000
