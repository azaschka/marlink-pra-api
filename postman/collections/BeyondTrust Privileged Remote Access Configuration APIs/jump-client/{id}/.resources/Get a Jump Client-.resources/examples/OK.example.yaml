    type: json
    content: |-
      {
        "jump_group_id": "<integer>",
        "id": "<integer>",
        "jump_group_type": "shared",
        "name": "<string>",
        "hostname": "<string>",
        "fqdn": "<string>",
        "tag": "<string>",
        "comments": "<string>",
        "jump_policy_id": "<integer>",
        "session_policy_id": "<integer>",
        "install_mode": "user",
