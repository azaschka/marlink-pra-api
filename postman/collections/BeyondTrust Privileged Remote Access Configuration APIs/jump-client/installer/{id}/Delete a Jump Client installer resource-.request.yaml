$kind: http-request
name: Delete a Jump Client installer resource.
description: Deletes the existing Jump Client installer resource with the given `{id}`.
url: "{{baseUrl}}/jump-client/installer/:id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Delete a Jump Client installer resource-.resources/examples
order: 2000
