          "fqdn": "<string>",
          "tag": "<string>",
          "comments": "<string>",
          "jump_policy_id": "<integer>",
          "session_policy_id": "<integer>",
          "install_mode": "service",
          "connection_type": "active",
          "last_connect_timestamp": "<dateTime>",
          "last_disconnect_timestamp": "<dateTime>",
          "is_lost": "<boolean>",
          "needs_update": "<boolean>",
          "unavailable_reason": "disabled",
