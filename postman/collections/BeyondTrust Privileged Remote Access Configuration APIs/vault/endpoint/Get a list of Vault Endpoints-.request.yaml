$kind: http-request
name: Get a list of Vault Endpoints.
description: >
  Gets a paginated list of all Vault endpoints. They can optionally be filtered
  using query string parameters documented below.


  If no filter criteria are specified then all Vault endpoints are returned.


  String parameters are always matched case-insensitively and exactly. No
  partial matches are allowed.
url: "{{baseUrl}}/vault/endpoint?per_page=<integer>&current_page=<integer>&name\
  =<string>&hostname=<string>&description=<string>&domain_name=<string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: per_page
    value: <integer>
    description: The number of items to include a paginated response.
  - key: current_page
    value: <integer>
    description: The 1-based index of the desired page.
  - key: name
    value: <string>
    description: Filters results to include only endpoints that match the given name.
  - key: hostname
    value: <string>
    description: Filters results to include only endpoints that match the given hostname.
  - key: description
    value: <string>
    description: Filters results to include only endpoints that match the given description.
  - key: domain_name
    value: <string>
    description: Filters results to include only endpoints that match the given domain name.
examples: ./.resources/Get a list of Vault Endpoints-.resources/examples
order: 2000
