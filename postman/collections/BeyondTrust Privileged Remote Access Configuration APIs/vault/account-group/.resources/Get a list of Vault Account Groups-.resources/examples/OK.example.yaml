$kind: http-example
request:
  url: "{{baseUrl}}/vault/account-group?per_page=<integer>&current_page=<integer>\
    &name=<string>"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: per_page
      value: <integer>
      description: The number of items to include a paginated response.
    - key: current_page
      value: <integer>
      description: The 1-based index of the desired page.
    - key: name
      value: <string>
      description: Filters results to include only account groups that match the given name.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    Link: ""
    X-BT-Pagination-Current-Page: ""
    X-BT-Pagination-Per-Page: ""
    X-BT-Pagination-Last-Page: ""
    X-BT-Pagination-Total: ""
  body:
    type: json
    content: |-
      {
        "id": "<integer>",
        "name": "<string>",
        "description": "<string>",
        "account_policy": "<string>"
      }
order: 1000
