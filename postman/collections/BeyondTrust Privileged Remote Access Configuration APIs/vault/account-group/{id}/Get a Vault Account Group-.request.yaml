$kind: http-request
name: Get a Vault Account Group.
description: Gets the Vault account group with the given `{id}`. A type-specific
  resource is returned.
url: "{{baseUrl}}/vault/account-group/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Get a Vault Account Group-.resources/examples
order: 4000
