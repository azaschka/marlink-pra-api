$kind: http-request
name: Get a list of Users with access to a Vault Account Group.
description: >
  Gets a paginated list of `VaultAccountGroupUser` resources representing users
  who are explicitly granted access to the Vault account group with the given
  `{id}`.

  This list does not include users implicitly granted access via a group policy.
url: "{{baseUrl}}/vault/account-group/:id/user?per_page=<integer>&current_page=\
  <integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: per_page
    value: <integer>
    description: The number of items to include a paginated response.
  - key: current_page
    value: <integer>
    description: The 1-based index of the desired page.
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Get a list of Users with access to a Vault Account
  Group-.resources/examples
order: 2000
