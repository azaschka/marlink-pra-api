$kind: http-request
name: Get a User in a Vault Account Group.
description: >
  Get a `VaultAccountGroupUser` resource representing the user with the given
  `{user_id}` in the Vault account group with the given `{id}`.
url: "{{baseUrl}}/vault/account-group/:id/user/:user_id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
  - key: user_id
    value: <integer>
    description: (Required) Unique identifier for the User.
examples: ./.resources/Get a User in a Vault Account Group-.resources/examples
order: 1000
