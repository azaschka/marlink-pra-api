$kind: http-request
name: Get a list of Accounts in a Vault Account Group.
description: Gets a paginated list of `VaultAccountGroupAccount` resources
  representing accounts that are part of the Vault Account Group with the given
  `{id}`.
url: "{{baseUrl}}/vault/account-group/:id/account?per_page=<integer>&current_pa\
  ge=<integer>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: per_page
    value: <integer>
    description: The number of items to include a paginated response.
  - key: current_page
    value: <integer>
    description: The 1-based index of the desired page.
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Get a list of Accounts in a Vault Account
  Group-.resources/examples
order: 2000
