$kind: http-example
name: Indicates the shared Jump Group was successfully added to the Account
  Group's Jump Item association criteria.
request:
  url: "{{baseUrl}}/vault/account-group/:id/jump-item-association/shared-jump-group"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "shared_jump_group_id": 53916575.32636094
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "account_group_id": "<integer>",
        "shared_jump_group_id": "<integer>"
      }
order: 1000
