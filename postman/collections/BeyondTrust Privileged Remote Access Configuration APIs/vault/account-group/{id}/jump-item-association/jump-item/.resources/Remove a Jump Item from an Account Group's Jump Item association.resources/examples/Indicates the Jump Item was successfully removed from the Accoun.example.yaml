$kind: http-example
name: Indicates the Jump Item was successfully removed from the Account Group's
  Jump Item association criteria.
request:
  url: "{{baseUrl}}/vault/account-group/:id/jump-item-association/jump-item"
  method: DELETE
  headers:
    Content-Type: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "id": "<integer>",
        "type": "remote_rdp"
      }
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
