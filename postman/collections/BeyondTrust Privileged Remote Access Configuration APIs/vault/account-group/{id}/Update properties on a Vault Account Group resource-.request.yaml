$kind: http-request
name: Update properties on a Vault Account Group resource.
description: Modifies an existing vault account group with the given `{id}`
  using the given properties.
url: "{{baseUrl}}/vault/account-group/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "description": "<string>",
      "account_policy": "<string>"
    }
examples: ./.resources/Update properties on a Vault Account Group
  resource-.resources/examples
order: 6000
