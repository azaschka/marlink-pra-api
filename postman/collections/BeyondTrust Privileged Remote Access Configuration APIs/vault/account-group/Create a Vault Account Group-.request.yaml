$kind: http-request
name: Create a Vault Account Group.
description: |
  Creates a new account group resource.

  The response body contains the new account group.
url: "{{baseUrl}}/vault/account-group"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "description": "<string>",
      "account_policy": "<string>"
    }
examples: ./.resources/Create a Vault Account Group-.resources/examples
order: 3000
