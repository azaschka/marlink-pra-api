$kind: http-request
name: Schedules a credential rotation.
description: Schedules a credential rotation for the Windows Domain or Windows
  Local account with the given `{id}`. An error is returned for accounts that
  cannot be rotated by the system.
url: "{{baseUrl}}/vault/account/:id/rotate"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Schedules a credential rotation-.resources/examples
order: 1000
