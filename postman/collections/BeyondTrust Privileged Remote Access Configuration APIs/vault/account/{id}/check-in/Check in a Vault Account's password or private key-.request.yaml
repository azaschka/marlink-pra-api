$kind: http-request
name: Check in a Vault Account's password or private key.
description: Checks in a Vault account's password or private key. This API
  supports most Vault account types, including Windows Local and Windows Domain
  accounts. `x509_ca` accounts cannot be checked out or checked in.
url: "{{baseUrl}}/vault/account/:id/check-in"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Check in a Vault Account's password or private
  key-.resources/examples
order: 1000
