$kind: http-request
name: Adds a User to a Vault Account.
description: |
  Adds a user to the Vault account with the given `{id}`.
  The response body contains the new `VaultAccountUser` resource.
url: "{{baseUrl}}/vault/account/:id/user"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
body:
  type: json
  content: |-
    {
      "user_id": "<integer>",
      "role": "inject"
    }
examples: ./.resources/Adds a User to a Vault Account-.resources/examples
order: 3000
