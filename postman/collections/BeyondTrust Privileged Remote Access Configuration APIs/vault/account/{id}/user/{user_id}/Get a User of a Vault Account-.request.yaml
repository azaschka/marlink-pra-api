$kind: http-request
name: Get a User of a Vault Account.
description: >
  Get a `VaultAccountUser` resource representing the user with the given
  `{user_id}` of the Vault account with the given `{id}`.
url: "{{baseUrl}}/vault/account/:id/user/:user_id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
  - key: user_id
    value: <integer>
    description: (Required) Unique identifier for the User.
examples: ./.resources/Get a User of a Vault Account-.resources/examples
order: 1000
