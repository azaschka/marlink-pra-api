$kind: http-example
name: The specified resource was not found.
request:
  url: "{{baseUrl}}/vault/account/:id/user/:user_id"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: ""
    user_id: ""
  body:
    type: json
    content: |-
      {
        "user_id": "<integer>",
        "role": "inject"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "<string>"
      }
order: 3000
