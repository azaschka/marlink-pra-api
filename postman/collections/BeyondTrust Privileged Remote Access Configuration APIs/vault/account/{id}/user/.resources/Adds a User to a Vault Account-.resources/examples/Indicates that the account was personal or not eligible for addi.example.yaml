$kind: http-example
name: Indicates that the account was personal or not eligible for adding a user.
request:
  url: "{{baseUrl}}/vault/account/:id/user"
  method: POST
  headers:
    Content-Type: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "user_id": "<integer>",
        "role": "inject"
      }
response:
  statusCode: 403
  statusText: Forbidden
  body:
    type: text
    content: ""
order: 2000
