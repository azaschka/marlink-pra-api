$kind: http-example
name: Indicates the user was successfully added to the Vault account.
request:
  url: "{{baseUrl}}/vault/account/:id/user"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "user_id": "<integer>",
        "role": "inject"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "user_id": "<integer>",
        "role": "inject"
      }
order: 1000
