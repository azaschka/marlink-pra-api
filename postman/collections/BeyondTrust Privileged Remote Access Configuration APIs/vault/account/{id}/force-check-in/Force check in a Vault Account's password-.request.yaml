$kind: http-request
name: Force check in a Vault Account's password.
description: Forcefully checks in a Vault account's password that was previously
  checked out by a different user or API account. This API supports all Vault
  account types, except `ssh`, `ssh_ca`, `x509_ca` and `x509_csr` accounts.
url: "{{baseUrl}}/vault/account/:id/force-check-in"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
examples: ./.resources/Force check in a Vault Account's password-.resources/examples
order: 1000
