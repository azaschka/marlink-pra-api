$kind: http-request
name: Remove a shared Jump Group from an Account's Jump Item association criteria.
description: >
  Removes a specific shared Jump Group identified by `{shared_jump_group_id}`
  from the Jump Item association criteria of the Account with the given `{id}`.


  The Account's Jump Item association must have its `filter_type` set to
  "criteria".


  This API cannot be used if the given Account is inheriting Jump Item
  association criteria from its Account Group and does not have any of its own
  Jump Item associations defined. To create association criteria specifically
  for this Account, use the <a
  href="#api.config.vault.account.jump-item-association.store">POST API</a>
  instead.
url: "{{baseUrl}}/vault/account/:id/jump-item-association/shared-jump-group"
method: DELETE
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
body:
  type: json
  content: |-
    {
      "shared_jump_group_id": "<integer>"
    }
examples: ./.resources/Remove a shared Jump Group from an Account's Jump Item
  associati.resources/examples
order: 2000
