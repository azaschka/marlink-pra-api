$kind: http-example
name: Indicates the shared Jump Group was successfully removed from the
  Account's Jump Item association criteria.
request:
  url: "{{baseUrl}}/vault/account/:id/jump-item-association/shared-jump-group"
  method: DELETE
  headers:
    Content-Type: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "shared_jump_group_id": "<integer>"
      }
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
