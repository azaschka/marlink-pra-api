$kind: http-example
name: Indicates the existing vault account policy was successfully updated and
  returns the new vault account policy.
request:
  url: "{{baseUrl}}/vault/account-policy/:id"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: ""
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "code_name": "<string>",
        "description": "<string>",
        "auto_rotate_credentials": "<boolean>",
        "allow_simultaneous_checkout": "<boolean>",
        "scheduled_password_rotation": "<boolean>",
        "maximum_password_age": "<integer>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "<string>",
        "id": "<integer>",
        "code_name": "<string>",
        "description": "<string>",
        "auto_rotate_credentials": "<boolean>",
        "allow_simultaneous_checkout": "<boolean>",
        "scheduled_password_rotation": "<boolean>",
        "maximum_password_age": "<integer>"
      }
order: 1000
