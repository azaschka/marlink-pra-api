$kind: http-request
name: Update properties on a Vault Account Policy resource.
description: Modifies an existing vault account policy with the given `{id}`
  using the given properties.
url: "{{baseUrl}}/vault/account-policy/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the resource.
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "code_name": "<string>",
      "description": "<string>",
      "auto_rotate_credentials": "<boolean>",
      "allow_simultaneous_checkout": "<boolean>",
      "scheduled_password_rotation": "<boolean>",
      "maximum_password_age": "<integer>"
    }
examples: ./.resources/Update properties on a Vault Account Policy
  resource-.resources/examples
order: 3000
