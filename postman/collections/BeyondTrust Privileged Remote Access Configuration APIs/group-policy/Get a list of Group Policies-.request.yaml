$kind: http-request
name: Get a list of Group Policies.
description: >
  Gets a paginated list of all Group Policies. They can optionally be filtered
  using query string parameters documented below.


  If no filter criteria are specified then all Group Policies are returned.


  String parameters are always matched case-insensitively and exactly. No
  partial matches are allowed.
url: "{{baseUrl}}/group-policy?per_page=<integer>&current_page=<integer>&name=<\
  string>"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: per_page
    value: <integer>
    description: The number of items to include a paginated response.
  - key: current_page
    value: <integer>
    description: The 1-based index of the desired page.
  - key: name
    value: <string>
    description: Filters results to include only policies that match the given name.
examples: ./.resources/Get a list of Group Policies-.resources/examples
order: 2000
