$kind: http-request
name: Update properties on a Group Policy resource.
description: Modifies an existing group policy with the given `{id}` using the
  given properties.
url: "{{baseUrl}}/group-policy/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the group policy.
body:
  type: json
  content: |-
    {
      "name": "<string>",
      "perm_access_allowed": false,
      "access_perm_status": "not_defined",
      "perm_share_other_team": false,
      "perm_invite_external_user": false,
      "perm_session_idle_timeout": -1,
      "perm_extended_availability_mode_allowed": false,
      "perm_edit_external_key": false,
      "perm_collaborate": false,
      "perm_collaborate_control": false,
      "perm_jump_client": false,
      "perm_local_jump": false,
      "perm_remote_jump": false,
      "perm_remote_vnc": false,
      "perm_remote_rdp": false,
      "perm_shell_jump": false,
      "perm_web_jump": false,
      "perm_protocol_tunnel": false,
      "perm_sd_static_port_for_external_tools": false,
      "default_jump_item_role_id": 1,
      "private_jump_item_role_id": 1,
      "inferior_jump_item_role_id": 1,
      "unassigned_jump_item_role_id": 1
    }
examples: ./.resources/Update properties on a Group Policy resource-.resources/examples
order: 11000
