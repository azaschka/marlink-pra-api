$kind: http-request
name: Removes a Team from a Group Policy.
description: Removes the team with the given `{team_id}` from the group policy
  with the given `{id}`.
url: "{{baseUrl}}/group-policy/:id/team/:team_id"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <integer>
    description: (Required) Unique identifier for the group policy.
  - key: team_id
    value: <integer>
    description: (Required) Unique identifier for the team.
examples: ./.resources/Removes a Team from a Group Policy-.resources/examples
order: 2000
