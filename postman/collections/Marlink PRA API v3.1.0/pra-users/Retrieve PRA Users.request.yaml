$kind: http-request
description: Internal endpoint (X-API-Key protected). Included for full internal PRA testing.
url: '{{baseUrl}}/pra-users'
method: GET
headers:
  - key: X-API-Key
    value: '{{apiKey}}'
    description: API key for internal PRA endpoints.
  - key: Authorization
    value: Bearer {{jwtToken}}
    description: JWT access token.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
queryParams:
  - key: pageSize
    value: '100'
    disabled: true
  - key: pageNumber
    value: '1'
    disabled: true
  - key: id
    value: '1'
    disabled: true
  - key: username
    value: string
    disabled: true
order: 1000
