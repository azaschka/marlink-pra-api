$kind: http-request
url: '{{baseUrl}}/beyondtrust-instances'
method: POST
headers:
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
body:
  type: json
  content: |-
    {
      "name": "string",
      "authClientId": "string",
      "authClientSecret": "string",
      "oauth2TokenUrl": "string",
      "apiBaseUrl": "string",
      "billingType": "user",
      "cname": "string"
    }
order: 5000
