$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: >
      // Basic response time test

      pm.test('Response time is less than 5000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });


      // Basic status code tests

      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204]);
      });


      // Check if the response content type is json

      pm.test('Health endpoint returns JSON', function () {
          pm.response.to.have.header('Content-Type');
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });


      // Check if the response contains the expected properties

      pm.test('Health response has required structure', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('status');
          pm.expect(jsonData).to.have.property('details');
      });
    language: text/javascript
examples: ./.resources/Health Check.resources/examples
order: 1000
