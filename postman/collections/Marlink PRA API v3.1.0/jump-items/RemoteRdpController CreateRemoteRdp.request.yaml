$kind: http-request
url: '{{baseUrl}}/jump-items/remote-rdps'
method: POST
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
body:
  type: json
  content: |-
    {
      "name": "string",
      "jumpointId": 0,
      "hostname": "string",
      "jumpGroupId": 0,
      "jumpGroupType": "shared",
      "qualityMode": "low",
      "mustStartNewConsoleSession": false,
      "mustIgnoreUntrustedServerCert": false,
      "tag": "string",
      "comments": "string",
      "rdpUsername": "string",
      "domain": "string",
      "jumpPolicyId": 0,
      "isSessionForensicsEnabled": false,
      "sessionPolicyId": 0,
      "secureAppType": "none",
      "remoteAppName": "string",
      "remoteAppParams": "string",
      "remoteExePath": "string",
      "remoteExeParams": "string",
      "targetSystem": "string",
      "credentialType": "string"
    }
order: 11000
