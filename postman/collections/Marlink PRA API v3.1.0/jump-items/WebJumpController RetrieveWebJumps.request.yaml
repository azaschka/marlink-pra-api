    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
queryParams:
  - key: pageSize
    value: '100'
    description: The number of items to include in a paginated response.
    disabled: true
  - key: pageNumber
    value: '1'
    description: The 1-based index of the desired page.
    disabled: true
  - key: name
    value: string
    disabled: true
  - key: url
    value: string
    disabled: true
  - key: jumpGroupIds
    value: string
    disabled: true
  - key: jumpGroupType
    value: shared
    disabled: true
  - key: jumpointId
    value: '1'
    disabled: true
  - key: tag
    value: string
    disabled: true
order: 28000
