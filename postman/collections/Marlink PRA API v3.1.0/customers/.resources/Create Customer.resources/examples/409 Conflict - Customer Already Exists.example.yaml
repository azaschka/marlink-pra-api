$kind: http-example
request:
  url: "{{baseUrl}}/customers"
  method: POST
  headers:
    X-Access-Key: "{{accessKey}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "key": "EXISTING_KEY",
        "name": "Duplicate Customer",
        "businessUnit": "MT",
        "beyondtrustInstanceId": 1
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 409,
        "timestamp": "2024-01-01T10:00:00.000Z",
        "path": "/customers",
        "message": "The specified customer already exists."
      }
order: 4000
