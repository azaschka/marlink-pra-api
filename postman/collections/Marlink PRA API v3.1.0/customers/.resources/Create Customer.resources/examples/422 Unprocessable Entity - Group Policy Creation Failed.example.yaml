$kind: http-example
request:
  url: "{{baseUrl}}/customers"
  method: POST
  headers:
    X-Access-Key: "{{accessKey}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "key": "CUST002",
        "name": "Test Customer",
        "businessUnit": "MT",
        "beyondtrustInstanceId": 999
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: >-
      {
        "statusCode": 422,
        "timestamp": "2024-01-01T10:00:00.000Z",
        "path": "/customers",
        "message": "Failed in downstream process. Most likely in creating admin group policy."
      }
order: 5000
