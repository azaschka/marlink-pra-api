$kind: http-request
url: "{{baseUrl}}/customers?pageSize=100&pageNumber=1"
method: GET
headers:
  - key: X-Access-Key
    value: "{{accessKey}}"
    description: Access key for authenticating and authorizing requests.
queryParams:
  - key: pageSize
    value: "100"
    description: Number of items per page
  - key: pageNumber
    value: "1"
    description: Page number
  - key: key
    value: string
    disabled: true
    description: Filter by customer key
  - key: name
    value: string
    disabled: true
    description: Filter by customer name
  - key: businessUnits
    value: MT
    disabled: true
    description: Filter by business unit
  - key: businessUnits
    value: OA
    disabled: true
    description: Filter by business unit
scripts:
  - type: afterResponse
    code: >-
      // Basic response time test

      pm.test('Response time is less than 5000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });


      // Basic status code tests

      pm.test('Status code is successful', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204]);
      });


      // Check if the response content type is json

      pm.test('Retrieve customers endpoint returns JSON', function () {
          pm.response.to.have.header('Content-Type');
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });


      // Check if the response contains the expected properties

      pm.test('Retrieve customers response has required structure', function ()
      {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an('array');

          if (jsonData.length > 0) {
              var firstItem = jsonData[0];
              pm.expect(firstItem).to.have.property('id');
              pm.expect(firstItem).to.have.property('key');
              pm.expect(firstItem).to.have.property('name');
              pm.expect(firstItem).to.have.property('businessUnit');
              pm.expect(firstItem).to.have.property('isDeactivated');
              pm.expect(firstItem).to.have.property('beyondtrustInstanceId');
              pm.expect(firstItem).to.have.property('creationDate');
              pm.expect(firstItem).to.have.property('lastModificationDate');
          }
      });
    language: text/javascript
examples: ./.resources/Retrieve Customers.resources/examples
order: 2000
