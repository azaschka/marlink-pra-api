$kind: http-request
url: '{{baseUrl}}/customers'
method: GET
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
queryParams:
  - key: pageSize
    value: '100'
    description: The number of items to include in a paginated response.
    disabled: true
  - key: pageNumber
    value: '1'
    description: The 1-based index of the desired page.
    disabled: true
  - key: key
    value: string
    description: Unique key for the customer.
    disabled: true
  - key: name
    value: string
    description: Unique name of the customer.
    disabled: true
  - key: businessUnits
    value: string
    description: Filter customers by business units.
    disabled: true
order: 1000
