$kind: http-example
request:
  url: "{{baseUrl}}/customers/1"
  method: PATCH
  headers:
    X-Access-Key: "{{accessKey}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "beyondtrustInstanceId": 2
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "key": "CUST001",
        "name": "Example Customer",
        "businessUnit": "MT",
        "beyondtrustInstanceId": 1,
        "isDeactivated": false,
        "creationDate": "2024-01-01T10:00:00.000Z",
        "modificationDate": "2024-01-01T10:05:00.000Z"
      }
order: 1000
