$kind: http-example
request:
  url: "{{baseUrl}}/customers/1"
  method: PATCH
  headers:
    X-Access-Key: restricted-access-key
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "beyondtrustInstanceId": 2
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
