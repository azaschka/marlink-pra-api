  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 409,
        "timestamp": "2024-01-01T10:00:00.000Z",
        "path": "/customers/1",
        "message": "Customer still have a site"
      }
order: 4000
