$kind: http-request
url: '{{baseUrl}}/group-policies/{{id}}'
method: PATCH
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
body:
  type: json
  content: |-
    {
      "name": "string",
      "hasEndpointsAccessPermission": false,
      "accessPermissionStatusType": "not-defined",
      "hasShareOtherTeamPermission": false,
      "hasInviteExternalUserPermission": false,
      "userSessionIdleTimeoutInSeconds": 0,
      "hasEnableExtendedAvailabilityModePermission": false,
      "hasEditExternalKeyPermission": false,
      "hasCollaboratePermission": false,
      "hasCollaborateControlPermission": false,
      "hasJumpClientPermission": false,
      "hasLocalJumpPermission": false,
      "hasRemoteJumpPermission": false,
      "hasRemoteVncPermission": false,
      "hasRemoteRdpPermission": false,
      "hasShellJumpPermission": false,
      "hasWebJumpPermission": false,
      "hasProtocolTunnelPermission": false,
      "hasSdStaticPortForExternalToolsPermission": false,
      "defaultJumpItemRoleId": 0,
      "privateJumpItemRoleId": 0,
      "inferiorJumpItemRoleId": 0,
      "unassignedJumpItemRoleId": 0
    }
order: 2000
