$kind: http-example
request:
  url: "{{baseUrl}}/sites"
  method: POST
  headers:
    X-Access-Key: "{{accessKey}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "key": "EXISTING_SITE",
        "name": "Duplicate Site",
        "customerKey": "CUST001"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 409,
        "timestamp": "2024-01-01T10:00:00.000Z",
        "path": "/sites",
        "message": "The specified site already exists."
      }
order: 6000
