$kind: http-example
request:
  url: "{{baseUrl}}/sites"
  method: GET
  headers:
    X-Access-Key: restricted-key
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 403,
        "timestamp": "2024-01-01T10:00:00.000Z",
        "path": "/sites",
        "message": "Forbidden customer access"
      }
order: 4000
