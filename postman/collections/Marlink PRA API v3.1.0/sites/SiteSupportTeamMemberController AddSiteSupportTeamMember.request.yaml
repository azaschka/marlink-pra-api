$kind: http-request
url: '{{baseUrl}}/sites/{{id}}/support-team-members'
method: POST
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
body:
  type: json
  content: |-
    {
      "firstname": "string",
      "lastname": "string",
      "email": "string",
      "supportTeamName": "string",
      "supportTeamAccessLevel": "full",
      "supportTeamTrustLevel": "require-auth"
    }
order: 11000
