$kind: http-request
url: '{{baseUrl}}/sites'
method: POST
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
body:
  type: json
  content: |-
    {
      "key": "string",
      "name": "string",
      "customerKey": "string",
      "siteManagers": [
        {
          "username": "string",
          "email": "string"
        }
      ],
      "siteAdministrators": [
        {
          "username": "string",
          "email": "string",
          "isAdminOperator": false
        }
      ],
      "siteSupportTeamMembers": [
        {
          "firstname": "string",
          "lastname": "string",
          "email": "string",
          "supportTeamName": "string",
          "supportTeamAccessLevel": "full",
          "supportTeamTrustLevel": "require-auth"
        }
      ],
      "siteApprovers": [
        "string"
      ]
    }
order: 2000
