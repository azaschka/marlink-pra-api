$kind: http-request
description: Retrieves all jumpoints associated with the specified site.
  Jumpoints are secure remote access endpoints deployed at the site location.
url: "{{baseUrl}}/sites/{{siteId}}/jumpoints?pageSize=100&pageNumber=1"
method: GET
headers:
  X-Access-Key: "{{accessKey}}"
queryParams:
  pageSize: "100"
  pageNumber: "1"
examples: ./.resources/Get Site Jumpoints.resources/examples
order: 1000
