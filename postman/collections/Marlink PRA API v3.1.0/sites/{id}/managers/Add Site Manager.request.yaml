$kind: http-request
description: Assigns a user as a site manager for the specified site. The user
  must exist and have appropriate permissions.
url: "{{baseUrl}}/sites/{{siteId}}/managers"
method: POST
headers:
  X-Access-Key: "{{accessKey}}"
body:
  type: json
  content: |-
    {
        "username": "string", // required
        "email": "string" // required
    }
examples: ./.resources/Add Site Manager.resources/examples
order: 3000
