$kind: http-example
request:
  url: "{{baseUrl}}/sites/1/managers"
  method: GET
  headers:
    X-Access-Key: "{{accessKey}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "id": 1,
          "siteId": 1,
          "userId": 1,
          "username": "manager1",
          "email": "manager1@example.com",
          "creationDate": "2024-01-01T10:00:00.000Z"
        }
      ]
order: 1000
