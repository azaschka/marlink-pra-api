$kind: http-example
request:
  url: "{{baseUrl}}/sites/1/managers"
  method: POST
  headers:
    X-Access-Key: "{{accessKey}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "site-manager@example.com",
         "email": "site-manager@example.com"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": 409,
        "timestamp": "2024-01-01T10:00:00.000Z",
        "path": "/sites/1/managers",
        "message": "The specified site manager already exists."
      }
order: 2000
