$kind: http-example
request:
  url: "{{baseUrl}}/sites/1/support-team-members"
  method: GET
  headers:
    X-Access-Key: "{{accessKey}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "id": 1,
          "siteId": 1,
          "userId": 3,
          "firstname": "John",
          "lastname": "Doe",
          "email": "support1@example.com",
          "supportTeamName": "Technical Support",
          "supportTeamAccessLevel": "full",
          "supportTeamTrustLevel": "require-auth",
          "creationDate": "2024-01-01T10:00:00.000Z"
        }
      ]
order: 1000
