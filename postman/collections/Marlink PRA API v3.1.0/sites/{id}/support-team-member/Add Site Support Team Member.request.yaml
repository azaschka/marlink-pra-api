$kind: http-request
description: Assigns a user as a support team member for the specified site. The
  user must exist and have appropriate technical permissions.
url: "{{baseUrl}}/sites/{{siteId}}/support-team-members"
method: POST
headers:
  X-Access-Key: "{{accessKey}}"
body:
  type: json
  content: >-
    {
        "firstname": "string", // required
        "lastname": "string", // required
        "email": "string", // required
        "supportTeamName": "string", // required
        "supportTeamAccessLevel": "limited", // required - full, limited
        "supportTeamTrustLevel": "require-auth" // required - reqire-auth, notify-only, no-restrictions
    }
examples: ./.resources/Add Site Support Team Member.resources/examples
order: 3000
