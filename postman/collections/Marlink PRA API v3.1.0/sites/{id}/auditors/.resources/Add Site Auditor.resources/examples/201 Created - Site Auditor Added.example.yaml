$kind: http-example
request:
  url: "{{baseUrl}}/sites/1/auditors"
  method: POST
  headers:
    X-Access-Key: "{{accessKey}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "userId": 2
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "siteId": 1,
        "userId": 2,
        "username": "admin1",
        "email": "admin1@example.com",
        "isAdminOperator": true,
        "creationDate": "2024-01-01T10:00:00.000Z"
      }
order: 1000
