$kind: http-request
description: Removes a user from the site auditor role for the specified site.
  The user will no longer have site administration privileges.
url: "{{baseUrl}}/sites/{{siteId}}/auditors/{{auditorId}}"
method: DELETE
headers:
  - key: X-Access-Key
    value: "{{accessKey}}"
    description: Access key for authenticating and authorizing requests.
examples: ./.resources/Remove Site Auditor.resources/examples
order: 1000
