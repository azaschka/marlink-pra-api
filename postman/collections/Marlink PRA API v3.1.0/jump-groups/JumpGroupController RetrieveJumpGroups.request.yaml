$kind: http-request
url: '{{baseUrl}}/jump-groups'
method: GET
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
queryParams:
  - key: pageSize
    value: '100'
    description: The number of items to include in a paginated response.
    disabled: true
  - key: pageNumber
    value: '1'
    description: The 1-based index of the desired page.
    disabled: true
  - key: name
    value: string
    disabled: true
  - key: codeName
    value: string
    disabled: true
  - key: namePatterns
    value: string
    description: Filters results to include only jump groups that match the given name patterns.
    disabled: true
order: 4000
