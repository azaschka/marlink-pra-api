$kind: http-request
description: Internal endpoint (X-API-Key protected). Included for full internal PRA testing.
url: '{{baseUrl}}/access'
method: POST
headers:
  - key: X-API-Key
    value: '{{apiKey}}'
    description: API key for internal PRA endpoints.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
body:
  type: json
  content: |-
    {
      "key": "ACCESS_KEY",
      "name": "Access Name",
      "value": {
        "businessUnits": [
          "MT"
        ]
      }
    }
order: 6000
