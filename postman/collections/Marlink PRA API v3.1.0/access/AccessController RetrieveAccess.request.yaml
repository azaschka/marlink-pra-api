$kind: http-request
name: AccessController RetrieveAccess
url: "{{baseUrl}}/access?pageSize=100&pageNumber=1"
method: GET
headers:
  - key: X-Transaction-Id
    value: "{{transactionId}}"
    disabled: true
    description: Optional identifier for tracing and correlating a transaction across services and logs.
  - key: x-api-key
    value: "{{apiKey}}"
queryParams:
  - key: pageSize
    value: "100"
    description: The number of items to include in a paginated response.
  - key: pageNumber
    value: "1"
    description: The 1-based index of the desired page.
  - key: key
    value: string
    disabled: true
    description: The key of the access.
  - key: name
    value: string
    disabled: true
    description: The name of the access.
order: 1000
