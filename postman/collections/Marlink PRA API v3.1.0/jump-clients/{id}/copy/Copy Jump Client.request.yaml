$kind: http-request
url: "{{baseUrl}}/jump-clients/{{jumpClientId}}/copy"
method: POST
headers:
  X-Access-Key: "{{accessKey}}"
  X-Tenant-Id: "{{tenantId}}"
body:
  type: json
  content: |-
    {
        "jumpGroupId": 0, // required
        "jumpGroupType": "shared", // required - shared, personal
        "name": "string" // required
    }
order: 1000
