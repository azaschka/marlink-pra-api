$kind: http-request
url: "{{baseUrl}}/jump-clients/{{jumpClientId}}"
method: PATCH
headers:
  X-Access-Key: "{{accessKey}}"
  X-Tenant-Id: "{{tenantId}}"
body:
  type: json
  content: |-
    {
        "jumpGroupId": 0,
        "jumpGroupType": "shared", // shared, personal
        "name": "string",
        "tag": "string",
        "comments": "string",
        "jumpPolicyId": 0,
        "sessionPolicyId": 0,
        "maxOfflineDurationInMinutes": 0,
        "endpointAgreementPolicyType": "accept" // accept, reject, no-prompt
    }
order: 3000
