$kind: http-request
url: '{{baseUrl}}/jump-clients/installers'
method: GET
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
queryParams:
  - key: pageSize
    value: '100'
    description: The number of items to include in a paginated response.
    disabled: true
  - key: pageNumber
    value: '1'
    description: The 1-based index of the desired page.
    disabled: true
  - key: name
    value: string
    description: Filters Jump Clients installers by the given name.
    disabled: true
  - key: hostname
    value: string
    description: Filters Jump Clients installers by the given hostname (computer name).
    disabled: true
  - key: fqdn
    value: string
    description: Filters Jump Clients installers by the given fully qualified domain name.
    disabled: true
  - key: tag
    value: string
    description: Filters Jump Clients installers by the given tag.
    disabled: true
  - key: jumpGroupIds
    value: string
    description: Filters Jump Clients installers by the given jump group ids.
    disabled: true
  - key: jumpGroupType
    value: personal
    description: Filters Jump Clients installers by the given jump group type.
    disabled: true
  - key: connectionType
    value: passive
    description: Filters Jump Clients installers by the given connection type.
    disabled: true
  - key: installerId
    value: string
    description: Filters Jump Clients installers by the installer id.
    disabled: true
order: 3000
