$kind: http-request
url: '{{baseUrl}}/jump-clients/{{id}}'
method: PATCH
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
body:
  type: json
  content: |-
    {
      "jumpGroupId": 0,
      "jumpGroupType": "personal",
      "name": "string",
      "tag": "string",
      "comments": "string",
      "jumpPolicyId": 0,
      "sessionPolicyId": 0,
      "maxOfflineDurationInMinutes": 0,
      "endpointAgreementPolicyType": "no-prompt"
    }
order: 7000
