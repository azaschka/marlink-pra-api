$kind: http-request
url: '{{baseUrl}}/jump-clients'
method: GET
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
queryParams:
  - key: pageSize
    value: '100'
    description: The number of items to include in a paginated response.
    disabled: true
  - key: pageNumber
    value: '1'
    description: The 1-based index of the desired page.
    disabled: true
  - key: name
    value: string
    description: Filters Jump Clients by the given name.
    disabled: true
  - key: hostname
    value: string
    description: Filters Jump Clients by the given hostname (computer name).
    disabled: true
  - key: fqdn
    value: string
    description: Filters Jump Clients by the given fully qualified domain name.
    disabled: true
  - key: tag
    value: string
    description: Filters Jump Clients by the given tag.
    disabled: true
  - key: jumpGroupIds
    value: string
    description: Filters Jump Clients by the given jump group ids.
    disabled: true
  - key: jumpGroupType
    value: personal
    description: Filters Jump Clients by the given jump group type.
    disabled: true
  - key: consoleUser
    value: string
    description: Filters Jump Clients by the given console user.
    disabled: true
  - key: publicIp
    value: string
    description: Filters Jump Clients by the given public IP address.
    disabled: true
  - key: privateIp
    value: string
    description: Filters Jump Clients by the given private IP address.
    disabled: true
  - key: connectionType
    value: passive
    description: Filters Jump Clients by the given connection type.
    disabled: true
order: 9000
