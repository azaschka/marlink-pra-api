$kind: http-request
url: '{{baseUrl}}/jump-clients/{{id}}/copy'
method: POST
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
body:
  type: json
  content: |-
    {
      "jumpGroupId": 0,
      "jumpGroupType": "personal",
      "name": "string"
    }
order: 10000
