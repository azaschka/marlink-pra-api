$kind: http-request
description: Retrieves the list of nodes associated with the specified jumpoint.
url: "{{baseUrl}}/jumpoints/{{jumpointId}}/nodes?pageSize=100&pageNumber=1"
method: GET
headers:
  X-Access-Key: "{{accessKey}}"
  X-Tenant-Id: "{{tenantId}}"
queryParams:
  pageSize: "100"
  pageNumber: "1"
order: 1000
