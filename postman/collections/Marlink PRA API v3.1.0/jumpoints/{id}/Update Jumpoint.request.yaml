$kind: http-request
description: Updates the configuration of an existing jumpoint. Only the
  specified fields will be modified.
url: "{{baseUrl}}/jumpoints/{{jumpointId}}"
method: PATCH
headers:
  X-Access-Key: "{{accessKey}}"
  X-Tenant-Id: "{{tenantId}}"
body:
  type: json
  content: >-
    {
        "name": "string",
        "codeName": "string",
        "comments": "string",
        "isEnabled": false, // boolean
        "isShellJumpEnabled": false, // boolean
        "externalJumpItemNetworkId": "string",
        "isProtocolTunnelEnabled": false, // boolean
        "rdpServiceAccountId": 0, // number or null
        "managedIpRanges": [
            {
                "start": "string",
                "end": "string"
            }
        ],
        "isJzpEnabled": false, // boolean
        "jzpProxyHostname": "string",
        "jzpProxyPort": 0, // number
        "isJzpHttpGetAllowed": false, // boolean
        "jzpClientAddressRestrictionsType": "deny-all", // no-restriction, allow-all, deny-all
        "jzpRestrictedIps": [
            "string"
        ]
    }
order: 4000
