$kind: http-request
url: '{{baseUrl}}/jumpoints/installers'
method: GET
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
queryParams:
  - key: businessUnit
    value: MT
    description: Business unit of the customer.
  - key: customerKey
    value: string
    description: Unique key for the customer.
  - key: siteKey
    value: string
    description: Unique key for the site.
order: 1000
