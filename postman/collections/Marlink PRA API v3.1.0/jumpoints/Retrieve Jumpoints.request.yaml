$kind: http-request
description: Retrieves a paginated list of all jumpoints configured in the
  system. Jumpoints are remote access endpoints that facilitate secure
  connections.
url: "{{baseUrl}}/jumpoints?pageSize=100&pageNumber=1"
method: GET
headers:
  X-Access-Key: "{{accessKey}}"
  X-Tenant-Id: "{{tenantId}}"
queryParams:
  pageSize: "100"
  pageNumber: "1"
order: 3000
