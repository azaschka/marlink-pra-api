$kind: http-request
url: "{{baseUrl}}/jump-policies/{{policyId}}"
method: PATCH
headers:
  X-Access-Key: "{{accessKey}}"
  X-Tenant-Id: "{{tenantId}}"
body:
  type: text
  content: |-
    {
        "displayName": "string",
        "codeName": "string",
        "description": "string",
        "hasScheduledAccessRestriction": true, // boolean
        "simultaneousJumpsType": "global", // global, join, disallow
        "doesSimultaneousJumpBehaviorApplyToCopies": true, // boolean
        "simultaneousJumpsRdpType": "global", // global, new-session, disallow
        "shouldForceRemoveUsersWhenScheduleDisallows": true, // boolean
        "isTicketIdRequired": true, // boolean
        "isTwoFactorChallengeRequired": true, // boolean
        "isSessionStartNotificationEnabled": true, // boolean
        "isSessionEndNotificationEnabled": true, // boolean
        "notificationEmailAddresses": [
            "string"
        ],
        "notificationDisplayName": "string",
        "notificationEmailLanguage": "string",
        "isApprovalRequired": true, // boolean
        "approvalMaxDurationInMinutes": 0,
        "approvalScopeType": "requestor", // requestor, anyone
        "approvalEmailAddresses": [
            "string"
        ],
        "approvalUserIds": [
            "string"
        ],
        "approvalTeamIds": [
            "string"
        ],
        "approvalDisplayName": "string",
        "approvalEmailLanguage": "string",
        "approvalApproverScopeType": "not-requestor", // not-requestor, anyone
        "isRecordingsDisabled": true // boolean
    }
order: 2000
