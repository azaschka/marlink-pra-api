$kind: http-request
url: "{{baseUrl}}/users/{{userId}}"
method: PATCH
headers:
  X-Access-Key: "{{accessKey}}"
  X-Tenant-Id: "{{tenantId}}"
body:
  type: json
  content: |-
    {
        "publicDisplayName": "string",
        "username": "string",
        "passwordExpirationDate": "2025-12-31T23:59:59.000Z",
        "email": "string",
        "preferredEmailLanguage": "string",
        "isTwoFactorAuthRequired": false, // boolean
        "isLoginAllowed": true, // boolean
        "mustResetPasswordOnNextLogin": false, // boolean
        "regeneratePassword": false // boolean
    }
order: 3000
