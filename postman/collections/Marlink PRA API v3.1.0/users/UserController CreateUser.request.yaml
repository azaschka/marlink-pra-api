$kind: http-request
url: '{{baseUrl}}/users'
method: POST
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
body:
  type: json
  content: |-
    {
      "publicDisplayName": "string",
      "username": "string",
      "password": "string",
      "passwordExpirationDate": "string",
      "email": "string",
      "preferredEmailLanguage": "string",
      "isTwoFactorAuthRequired": false,
      "isLoginAllowed": false,
      "failedLoginAttempts": 0,
      "mustResetPasswordOnNextLogin": false
    }
order: 5000
