$kind: http-request
url: '{{baseUrl}}/users'
method: GET
headers:
  - key: X-Access-Key
    value: '{{accessKey}}'
    description: Access key for authenticating and authorizing requests.
  - key: X-Transaction-Id
    value: '{{transactionId}}'
    description: Optional identifier for tracing and correlating a transaction across services and logs.
    disabled: true
  - key: X-Tenant-Id
    value: '{{tenantId}}'
    description: The identifier for the tenant making the request.
queryParams:
  - key: pageSize
    value: '100'
    description: The number of items to include in a paginated response.
    disabled: true
  - key: pageNumber
    value: '1'
    description: The 1-based index of the desired page.
    disabled: true
  - key: securityProviderId
    value: '1'
    description: Filters results to include only users with the given security provider ID.
    disabled: true
  - key: username
    value: string
    description: Filters results to include only users with the given username.
    disabled: true
  - key: email
    value: string
    description: Filters results to include only users with the given email address.
    disabled: true
  - key: publicDisplayNamePatterns
    value: string
    description: Filters results to include only users that match the given name patterns.
    disabled: true
order: 4000
