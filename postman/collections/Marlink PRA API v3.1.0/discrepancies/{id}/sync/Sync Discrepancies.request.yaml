$kind: http-request
url: "{{baseUrl}}/discrepancies/:id/sync"
method: POST
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    description: The identifier for the tenant making the request.
pathVariables:
  - key: id
    value: "36"
    description: The id of the discrepancy.
body:
  type: json
  content: >-
    {
        "syncType": "external-to-internal" // external-to-internal, internal-to-external
    }
order: 1000
