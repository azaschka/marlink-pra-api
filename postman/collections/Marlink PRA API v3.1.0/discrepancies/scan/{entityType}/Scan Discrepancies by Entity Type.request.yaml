$kind: http-request
url: "{{baseUrl}}/discrepancies/scan/:entityType"
method: POST
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    description: The identifier for the tenant making the request.
pathVariables:
  - key: entityType
    value: user
    description: The type of entity to scan for discrepancies.
order: 1000
