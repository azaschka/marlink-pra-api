$kind: http-request
description: >-
  **Purpose:**

  Initiates a scan to identify and summarize discrepancies across all supported
  entity types in the system. Use this endpoint to compare internal and external
  data sources and retrieve a detailed report of mismatches, missing, or extra
  records for each entity type.


  **Endpoint:**

  POST `{{baseUrl}}/discrepancies/scan/all`


  **Required Headers:**

  - `X-Tenant-Id: {{tenantId}}` (Specifies the tenant context for the scan)


  **Request Body:**

  - None. This endpoint does not require a request body.


  **Response Structure:**

  Returns a JSON array where each object summarizes discrepancies for a specific
  entity type. Each object contains:

  - `entityType` (string): The type of entity scanned (e.g., 'user',
  'group-policy').

  - `totalBtData` (integer): Total records found in the external (BeyondTrust)
  data source.

  - `totalDbData` (integer): Total records found in the internal database.

  - `identicalIds` (array of integers): IDs present and matching in both
  sources.

  - `onlyInExternalIds` (array of integers): IDs found only in the external
  source.

  - `onlyInInternalIds` (array of integers): IDs found only in the internal
  source.

  - `mismatchedIds` (array of integers): IDs present in both sources but with
  differing data.


  **Example Response:**

  ```json

  [
    {
      "entityType": "user",
      "totalBtData": 314,
      "totalDbData": 313,
      "identicalIds": [2,5,6,7,8,10,13,34,116,119],
      "onlyInExternalIds": [622],
      "onlyInInternalIds": [],
      "mismatchedIds": [1,3,9,18,33,122,127,155,235,238]
    },
    ...
  ]

  ```


  **When to Use:**

  Call this endpoint to perform a comprehensive discrepancy scan across all
  entities for the specified tenant. Useful for data integrity checks, audits,
  and synchronization processes.
url: "{{baseUrl}}/discrepancies/scan/all"
method: POST
headers:
  - key: X-Tenant-Id
    value: "{{tenantId}}"
    description: The identifier for the tenant making the request.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is successful", function () {
          pm.response.to.be.success;
      });
    language: text/javascript
order: 1000
